server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy da API para o servico backend (nome do servico no
    # docker-compose). O client do frontend usa baseURL relativa
    # ("/api/v1"), entao o proprio nginx encaminha para o backend Flask.
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: qualquer rota desconhecida cai no index.html (React Router
    # cuida do roteamento no client).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets com hash no nome podem ser cacheados de forma agressiva.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

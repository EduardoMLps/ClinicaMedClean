<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Med Flow — Clínica Odontológica</title>
<link rel="icon" type="image/png" href="logo-medflow.png">
<style>
  :root{
    --brand-50:#eef7ff; --brand-100:#d9edff; --brand-200:#b9dcff; --brand-300:#84c3ff;
    --brand-400:#48a4ff; --brand-500:#1f85f5; --brand-600:#0d68d4; --brand-700:#0d53ab;
    --brand-800:#11478c; --brand-900:#133e74;
    --ink-900:#0f172a; --ink-700:#334155; --ink-500:#64748b; --ink-300:#94a3b8;
    --ink-100:#e2e8f0; --ink-50:#f1f5f9;
    --ok:#0f9d58; --ok-bg:#e6f6ee;
    --warn:#b45309; --warn-bg:#fef3c7;
    --danger:#b91c1c; --danger-bg:#fee2e2;
    /* paleta de gráficos — validada para daltonismo (ΔE CVD >= 8) */
    --serie-1:#2a78d6; --serie-2:#eb6834; --serie-3:#1baf7a;
    --grid:#e8eef5;
    --radius:14px;
    --shadow:0 1px 2px rgba(15,23,42,.06), 0 8px 24px rgba(15,23,42,.06);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
       color:var(--ink-900);background:var(--ink-50);-webkit-font-smoothing:antialiased}
  button{font:inherit}
  input,select,textarea{font:inherit}

  .hidden{display:none !important}
  .card{background:#fff;border:1px solid var(--brand-100);border-radius:var(--radius);
        box-shadow:var(--shadow);padding:20px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;
       padding:10px 16px;font-weight:600;cursor:pointer;border:1px solid transparent;transition:.15s}
  .btn-primary{background:var(--brand-600);color:#fff}
  .btn-primary:hover{background:var(--brand-700)}
  .btn-secondary{background:#fff;color:var(--ink-700);border-color:var(--brand-200)}
  .btn-secondary:hover{background:var(--brand-50)}
  .btn-perigo{background:#fff;color:var(--danger);border-color:#fca5a5}
  .btn-perigo:hover{background:var(--danger-bg)}
  .btn-sm{padding:6px 12px;font-size:13px;border-radius:9px}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .input{width:100%;border:1px solid var(--ink-100);border-radius:11px;padding:10px 13px;
         background:#fff;color:var(--ink-900);outline:none;transition:.15s}
  .input:focus{border-color:var(--brand-400);box-shadow:0 0 0 3px var(--brand-100)}
  .label{display:block;font-size:13px;font-weight:600;color:var(--ink-700);margin-bottom:6px}
  .badge{display:inline-flex;align-items:center;border-radius:999px;padding:3px 10px;font-size:12px;
         font-weight:600;background:var(--brand-100);color:var(--brand-800);white-space:nowrap}
  .badge.ok{background:var(--ok-bg);color:var(--ok)}
  .badge.warn{background:var(--warn-bg);color:var(--warn)}
  .badge.danger{background:var(--danger-bg);color:var(--danger)}
  .badge.muted{background:var(--ink-50);color:var(--ink-500)}
  .muted{color:var(--ink-500)}
  .small{font-size:13px}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-500);
     padding:10px 12px;border-bottom:1px solid var(--ink-100);white-space:nowrap}
  td{padding:12px;border-bottom:1px solid var(--ink-50);font-size:14px;vertical-align:middle}
  tbody tr:hover{background:var(--brand-50)}
  tfoot td{font-weight:700;border-top:2px solid var(--ink-100);background:var(--ink-50)}
  .table-wrap{overflow:auto;border-radius:var(--radius)}

  /* ---------- login ---------- */
  #tela-login{min-height:100%;display:grid;place-items:center;padding:24px;
    background:linear-gradient(135deg,var(--brand-800),var(--brand-600) 55%,var(--brand-400))}
  .login-box{width:100%;max-width:430px;background:#fff;border-radius:20px;padding:32px;
             box-shadow:0 24px 60px rgba(15,23,42,.28)}
  .logo{display:flex;align-items:center;gap:11px;justify-content:center}
  .logo svg,.logo img{width:42px;height:42px;border-radius:11px;object-fit:cover;flex:0 0 auto}
  .logo-txt{font-size:19px;font-weight:800;color:var(--brand-800);line-height:1.15}
  .abas{display:flex;background:var(--ink-50);border-radius:12px;padding:4px;margin:22px 0 22px}
  .aba{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 8px;font-size:13.5px;
       font-weight:700;color:var(--ink-500);cursor:pointer;transition:.15s}
  .aba.ativa{background:#fff;color:var(--brand-700);box-shadow:var(--shadow)}
  .dica{margin-top:18px;background:var(--brand-50);border:1px dashed var(--brand-200);
        border-radius:12px;padding:12px 14px;font-size:13px;color:var(--brand-800)}
  .msg-erro{background:var(--danger-bg);color:var(--danger);border-radius:10px;padding:10px 13px;
            font-size:13px;font-weight:600;margin-bottom:14px}
  .msg-ok{background:var(--ok-bg);color:var(--ok);border-radius:10px;padding:10px 13px;
          font-size:13px;font-weight:600;margin-bottom:14px}
  .link{background:none;border:0;color:var(--brand-600);font-size:13px;font-weight:600;
        cursor:pointer;padding:0;text-decoration:underline}

  /* ---------- layout admin ---------- */
  .app-shell{min-height:100%;display:grid;grid-template-columns:250px 1fr}
  aside{background:linear-gradient(180deg,var(--brand-800),var(--brand-900));color:#fff;padding:22px 16px;
        display:flex;flex-direction:column;gap:6px;min-height:100vh;position:sticky;top:0;height:100vh;overflow:auto}
  aside .logo{justify-content:flex-start;margin-bottom:22px}
  aside .logo-txt{color:#fff;font-size:16px}
  .nav-link{display:flex;align-items:center;gap:11px;border-radius:11px;padding:10px 13px;font-size:14px;
            font-weight:600;color:var(--brand-100);cursor:pointer;border:0;background:transparent;
            width:100%;text-align:left;transition:.15s}
  .nav-link:hover{background:rgba(255,255,255,.10);color:#fff}
  .nav-link.active{background:rgba(255,255,255,.17);color:#fff}
  .nav-link svg{width:19px;height:19px;flex:0 0 auto}
  .nav-sep{margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,255,255,.15)}
  main{padding:26px 30px 60px;max-width:1500px;width:100%}
  .topo{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:22px}
  .topo h1{margin:0;font-size:25px;letter-spacing:-.02em}
  .topo p{margin:5px 0 0;color:var(--ink-500);font-size:14px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
  .kpi{display:flex;gap:14px;align-items:flex-start}
  .kpi-ico{width:46px;height:46px;border-radius:50%;background:var(--brand-100);display:grid;
           place-items:center;flex:0 0 auto;color:var(--brand-600)}
  .kpi-ico svg{width:23px;height:23px}
  .kpi-val{font-size:23px;font-weight:700;margin:3px 0 0}
  .kpi-lbl{font-size:13px;color:var(--ink-500);font-weight:600;margin:0}
  .kpi-hint{font-size:12px;color:var(--ink-300);margin:2px 0 0}
  .secao-titulo{font-size:16px;font-weight:700;margin:0 0 14px}
  .barra{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
  .duas{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
  main{min-width:0}
  @media(max-width:1000px){.duas{grid-template-columns:minmax(0,1fr)}}
  @media(max-width:820px){
    .app-shell{grid-template-columns:minmax(0,1fr)}
    #nav{display:flex;flex-wrap:wrap;gap:4px}
    aside{position:static;height:auto;min-height:0;flex-direction:row;flex-wrap:wrap;align-items:center}
    aside .logo{margin-bottom:0;margin-right:8px}
    .nav-link{width:auto}
    .nav-sep{margin-top:0;border-top:0;padding-top:0}
    main{padding:20px 16px 50px}
  }

  /* ---------- portal do paciente ---------- */
  .portal-topo{background:linear-gradient(120deg,var(--brand-800),var(--brand-600));color:#fff;
               padding:18px 30px;display:flex;align-items:center;justify-content:space-between;
               gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
  .portal-topo .logo-txt{color:#fff;font-size:16px}
  .portal-nav{display:flex;gap:8px;flex-wrap:wrap}
  .portal-nav button{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:10px;
                     padding:8px 15px;font-size:13.5px;font-weight:600;cursor:pointer;transition:.15s}
  .portal-nav button:hover{background:rgba(255,255,255,.26)}
  .portal-nav button.active{background:#fff;color:var(--brand-700)}
  .portal-main{max-width:1050px;margin:0 auto;padding:28px 22px 70px}

  /* wizard */
  .passos{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
  .passo{flex:1;min-width:120px;border-radius:11px;padding:11px 13px;background:#fff;
         border:1px solid var(--ink-100);font-size:12.5px;font-weight:700;color:var(--ink-300)}
  .passo.feito{border-color:var(--ok);color:var(--ok);background:var(--ok-bg)}
  .passo.atual{border-color:var(--brand-500);color:var(--brand-700);background:var(--brand-50)}
  .passo span{display:block;font-size:11px;font-weight:600;opacity:.8;margin-bottom:2px}
  .opcoes{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
  .opcao{border:1.5px solid var(--ink-100);border-radius:13px;padding:15px;background:#fff;
         cursor:pointer;text-align:left;transition:.15s;font-weight:600;font-size:14px;width:100%}
  .opcao:hover{border-color:var(--brand-400);background:var(--brand-50)}
  .opcao.sel{border-color:var(--brand-600);background:var(--brand-50);box-shadow:0 0 0 3px var(--brand-100)}
  .opcao .op-sub{display:block;font-weight:500;font-size:12.5px;color:var(--ink-500);margin-top:5px}
  .horarios{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:9px}
  .hora-btn{border:1.5px solid var(--ink-100);background:#fff;border-radius:10px;padding:10px 6px;
            font-weight:700;font-size:14px;cursor:pointer;transition:.15s}
  .hora-btn:hover:not(:disabled){border-color:var(--brand-400);background:var(--brand-50)}
  .hora-btn.sel{border-color:var(--brand-600);background:var(--brand-600);color:#fff}
  .hora-btn:disabled{background:var(--ink-50);color:var(--ink-300);cursor:not-allowed;
                     text-decoration:line-through}
  .resumo{background:var(--brand-50);border:1px solid var(--brand-200);border-radius:13px;padding:17px}
  .resumo dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:9px 16px;font-size:14px}
  .resumo dt{color:var(--ink-500);font-weight:600}
  .resumo dd{margin:0;font-weight:600;text-align:right}
  .pix-box{background:#0f172a;color:#7ee7bb;font-family:Consolas,monospace;font-size:12.5px;
           padding:14px;border-radius:11px;word-break:break-all;line-height:1.6}

  /* ---------- gráficos ---------- */
  .gr{--h:190px}
  .gr-legenda{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px;font-size:13px;font-weight:600}
  .gr-legenda span{display:inline-flex;align-items:center;gap:7px;color:var(--ink-700)}
  .gr-legenda i{width:11px;height:11px;border-radius:3px;display:block}
  .gr-cols{display:flex;align-items:flex-end;gap:2px;height:var(--h);border-bottom:1px solid var(--ink-100);
           padding-top:22px;position:relative}
  .gr-grupo{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:2px;height:100%;
            position:relative;padding:0 4px}
  .gr-bar{flex:1;max-width:34px;border-radius:4px 4px 0 0;min-height:2px;position:relative;
          transition:.15s;cursor:default}
  .gr-bar:hover{filter:brightness(1.12)}
  .gr-eixo{display:flex;gap:2px;margin-top:8px}
  .gr-eixo div{flex:1;text-align:center;font-size:11.5px;color:var(--ink-500);font-weight:600}
  .gr-tip{position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%);
          background:var(--ink-900);color:#fff;padding:7px 11px;border-radius:9px;font-size:12px;
          font-weight:600;white-space:nowrap;opacity:0;pointer-events:none;transition:.12s;z-index:5}
  .gr-grupo:hover .gr-tip{opacity:1}
  .gr-rotulo{position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);
             font-size:11px;font-weight:700;color:var(--ink-700);white-space:nowrap}
  .gr-linhas{position:absolute;inset:22px 0 0 0;pointer-events:none}
  .gr-linhas div{position:absolute;left:0;right:0;border-top:1px dashed var(--grid)}
  .hbar-lista{display:grid;gap:13px}
  .hbar{display:grid;grid-template-columns:150px 1fr 120px;gap:13px;align-items:center;font-size:13.5px}
  .hbar-trilho{background:var(--ink-50);border-radius:5px;height:15px;overflow:hidden}
  .hbar-trilho i{display:block;height:100%;border-radius:4px}
  .hbar-val{text-align:right;font-weight:700;font-size:13.5px}
  .hbar-total{border-top:2px solid var(--ink-100);padding-top:10px;margin-top:2px}
  .hbar-total span{font-weight:800}
  .gr-total{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:flex-end;margin-top:12px;padding-top:10px;
    border-top:2px solid var(--ink-100);font-size:13.5px;color:var(--ink-700)}
  .gr-total b{color:var(--ink-900)}
  .totais-periodo td:last-child,.totais-periodo th:last-child{text-align:right}
  .linha-liquido td{font-weight:800;font-size:15px;background:var(--brand-50)}
  @media(max-width:620px){.hbar{grid-template-columns:110px 1fr 96px;font-size:12.5px}}

  /* ---------- modal / toast ---------- */
  .modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);display:grid;place-items:center;
            padding:20px;z-index:60}
  .modal{background:#fff;border-radius:18px;padding:26px;width:100%;max-width:560px;max-height:88vh;
         overflow:auto;box-shadow:0 24px 60px rgba(15,23,42,.3)}
  .modal h3{margin:0 0 4px;font-size:19px}
  .modal .sub{margin:0 0 20px;color:var(--ink-500);font-size:13.5px}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:560px){.form-grid{grid-template-columns:1fr}}
  .col-full{grid-column:1/-1}
  .modal-acoes{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
  #toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:10px;z-index:90}
  .toast{background:var(--ink-900);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;
         font-weight:600;box-shadow:var(--shadow);animation:up .25s ease;max-width:330px}
  .toast.ok{background:var(--ok)}
  .toast.warn{background:var(--warn)}
  @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .aviso{background:var(--warn-bg);color:var(--warn);padding:12px 14px;border-radius:11px;font-size:13.5px}
  .info{background:var(--brand-50);color:var(--brand-800);padding:12px 14px;border-radius:11px;
        font-size:13.5px;border:1px dashed var(--brand-200)}
  .print-header{display:none}
  @media print{
    aside,.portal-topo,.barra,.btn,#toasts{display:none !important}
    body{background:#fff}
    main{padding:0;grid-column:1 / -1;max-width:none}
    .card{box-shadow:none;border-color:#ccc;break-inside:avoid}
    .print-header{display:flex !important;align-items:center;gap:14px;
      margin-bottom:18px;padding-bottom:14px;border-bottom:2px solid #ccc}
    .print-header img{width:52px;height:52px;border-radius:12px;object-fit:cover}
    .print-header h2{margin:0;font-size:18px}
    .print-header p{margin:2px 0 0;font-size:12.5px;color:#555}
  }

  /* ---------- whatsapp + rodapé institucional (visíveis em todas as telas) ---------- */
  .whats-flutuante{position:fixed;right:18px;bottom:54px;z-index:60;width:54px;height:54px;
    border-radius:50%;background:#25D366;color:#fff;display:grid;place-items:center;
    box-shadow:var(--shadow);text-decoration:none;transition:.15s}
  .whats-flutuante:hover{transform:scale(1.06)}
  .whats-flutuante svg{width:28px;height:28px}
  .rodape-clinica{position:fixed;left:0;right:0;bottom:0;z-index:55;
    background:rgba(255,255,255,.97);border-top:1px solid var(--brand-100);
    padding:7px 16px;font-size:12px;color:var(--ink-500);
    display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center;align-items:center}
  .rodape-clinica a{color:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
  .rodape-clinica a:hover{text-decoration:underline;color:var(--brand-700)}
  .rodape-clinica b{color:var(--ink-700)}
  @media print{.rodape-clinica,.whats-flutuante{display:none !important}}

/* ---- Odontograma ---- */
.odt-arco{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.odt-dente{width:42px;height:52px;border:1.5px solid rgba(0,0,0,.14);border-radius:8px;
  font-weight:700;font-size:13px;cursor:pointer;display:grid;place-items:center;
  transition:transform .1s, box-shadow .1s}
.odt-dente:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(0,0,0,.12)}
.odt-legenda{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px;justify-content:center}
.odt-leg{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-500)}
.odt-leg i{width:14px;height:14px;border-radius:4px;border:1.5px solid;display:inline-block}
.odt-opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:10px 0 4px}
.odt-opt{border:2px solid rgba(0,0,0,.06);border-radius:10px;padding:13px;font-weight:700;
  cursor:pointer;font-size:14px;text-align:center}
.odt-opt.sel{outline:3px solid rgba(0,0,0,.22);outline-offset:1px}
@media (max-width:520px){.odt-dente{width:32px;height:42px;font-size:11.5px}.odt-opts{grid-template-columns:1fr}}
@media print{.odt-dente,.odt-leg i{-webkit-print-color-adjust:exact;print-color-adjust:exact}}

/* ---- Odontograma: extras (faces, nota, chips, toolbar) ---- */
.odt-arcada{margin:4px 0}
.odt-arc-lbl{display:block;text-align:center;font-size:11px;font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-500);margin-bottom:4px}
.odt-mid{width:2px;align-self:stretch;background:var(--ink-100);margin:0 5px;border-radius:2px}
.odt-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:2px}
.odt-dente{position:relative;flex-direction:column;gap:1px;line-height:1.05}
.odt-num{font-size:13px}
.odt-faces{font-size:8.5px;font-weight:800;letter-spacing:.5px;opacity:.85}
.odt-dente.atendido{box-shadow:0 0 0 2.5px #0369a1, 0 2px 8px rgba(3,105,161,.22)}
.odt-dente.has-nota::after{content:'';position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:currentColor}
.odt-chips{display:flex;gap:8px;flex-wrap:wrap}
.odt-chip{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--ink-100);background:var(--surface,#fff);
  font-weight:800;cursor:pointer;color:var(--ink-600)}
.odt-chip.on{background:var(--brand-600);color:#fff;border-color:var(--brand-600)}

/* ---- Odontograma anatômico 3D (arcada em vista oclusal) ---- */
.odt3d{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,250px);gap:18px;align-items:start;margin:6px 0 2px}
.odt3d-stage{position:relative;perspective:1200px;border-radius:18px;
  background:radial-gradient(120% 90% at 50% 18%,#ffffff 0%,#eef6ff 55%,#dcebfb 100%);
  border:1px solid var(--brand-100);padding:10px 6px 4px;overflow:hidden}
.odt3d-stage::after{content:'';position:absolute;inset:auto 12% 6px;height:22px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(17,71,140,.16),transparent);pointer-events:none}
.odt3d-svg{display:block;width:100%;max-width:520px;height:auto;margin:0 auto;
  transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transform-style:preserve-3d;
  transition:transform .35s cubic-bezier(.2,.7,.2,1);will-change:transform}
.odt3d-dente{cursor:pointer;outline:none}
.odt3d-dente .odt3d-corpo{transition:transform .18s cubic-bezier(.2,.7,.2,1)}
.odt3d-dente:hover .odt3d-corpo,.odt3d-dente:focus-visible .odt3d-corpo,.odt3d-dente.ativo .odt3d-corpo{
  transform:translate(var(--lx,0px),var(--ly,0px)) scale(1.12)}
.odt3d-dente:focus-visible .odt3d-foco,.odt3d-dente.ativo .odt3d-foco{opacity:1}
.odt3d-foco{opacity:0;transition:opacity .15s}

function senhaPadrao(p){
  if (!p || !p.nasc) return '';
  const partes = p.nasc.split('-');            // aaaa-mm-dd
  return partes[2] + partes[1] + partes[0];    // ddmmaaaa
}
/* aceita 14031990, 14/03/1990 e 1990-03-14 como a mesma senha */
function normalizaSenha(txt){
  const d = soDigitos(txt);
  if (d.length === 8 && Number(d.slice(0,4)) > 1900) return d.slice(6,8) + d.slice(4,6) + d.slice(0,4);
  return d.length === 8 ? d : String(txt || '');
}

/* ---- conflito de horário considerando a duração do procedimento ----
   Há choque quando os intervalos se sobrepõem na mesma cadeira ou com o mesmo profissional. */
function minutosDe(h){ const x = String(h).split(':').map(Number); return x[0] * 60 + (x[1] || 0); }
function duracaoProc(id){ const p = db.procedimentos.find(x => x.id === Number(id)); return p ? p.duracao : 30; }
function choqueAgenda(data, hora, procId, cadeiraId, profId, ignorarId){
  const ini = minutosDe(hora), fim = ini + duracaoProc(procId);
  return db.agendamentos.find(a => a.id !== ignorarId && a.data === data && a.status !== 'Cancelado' &&
    (a.cadeira_id === Number(cadeiraId) || a.profissional_id === Number(profId)) &&
    ini < minutosDe(a.hora) + duracaoProc(a.proc) && minutosDe(a.hora) < fim) || null;
}

/* ---- gera agendamentos e lançamentos do ano (para os relatórios) ---- */
(function semear(){
  let idA = 1, idF = 1;
  const rnd = (function(){ let s = 20260817;
    return () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; }; })();
  const statusPassado = ['Concluído','Concluído','Concluído','Concluído','Faltou','Cancelado'];

  /* histórico: do dia 1º de janeiro até hoje */
  for (let d = new Date(ANO, 0, 1); d <= hoje; d.setDate(d.getDate() + 1)) {
    const dia = iso(d), dw = d.getDay();
    if (dw === 0) continue;                       // domingo fechado
    const qtd = dw === 6 ? 2 : 3 + Math.floor(rnd() * 4);
    const usados = [];
    for (let i = 0; i < qtd; i++) {
      let h = HORARIOS[Math.floor(rnd() * HORARIOS.length)];
      let cad = 1 + Math.floor(rnd() * 2);
      if (usados.indexOf(h + '#' + cad) >= 0) continue;
      usados.push(h + '#' + cad);
      const pr = db.procedimentos[Math.floor(rnd() * db.procedimentos.length)];
      const pa = db.pacientes[Math.floor(rnd() * db.pacientes.length)];
      const pf = db.profissionais[Math.floor(rnd() * db.profissionais.length)];
      if (choqueAgenda(dia, h, pr.id, cad, pf.id)) continue;
      const st = dia < HOJE ? statusPassado[Math.floor(rnd() * statusPassado.length)]
               : (dia === HOJE ? (h < '12:00' ? 'Concluído' : 'Confirmado') : 'Agendado');
      const forma = FORMAS[Math.floor(rnd() * FORMAS.length)];
      const pago = st === 'Concluído';
      db.agendamentos.push({id:idA++, paciente_id:pa.id, profissional_id:pf.id, cadeira_id:cad,
        data:dia, hora:h, proc:pr.id, status:st, forma:pago ? forma : null, pago:pago,
        origem: rnd() < 0.25 ? 'Portal do paciente' : 'Recepção'});
      if (pago) {
        db.financeiro.push({id:idF++, tipo:'Receita', desc:pr.nome + ' — ' + pa.nome,
          cat:'Procedimentos', valor:pr.valor, data:dia, status:'Pago', forma:forma,
          paciente_id:pa.id, agendamento_id:idA - 1});
      }
    }
  }
  /* agendamentos futuros: de amanhã até 31/12/2026, de segunda a sábado,
     4 a 6 atendimentos por dia, alternando pacientes, procedimentos e profissionais */
  const FIM_AGENDA = new Date(2026, 11, 31);
  const especialista = {4:3, 7:2};               // canal -> endodontia, aparelho -> ortodontia
  const procRodizio = [1,2,3,7,2,4,1,3,5,6,2,7,3,1,4,2,6,3,7,5];
  let iPac = 0, iProc = 0;
  const amanha = new Date(hoje); amanha.setDate(amanha.getDate() + 1);
  for (let d = new Date(amanha.getFullYear(), amanha.getMonth(), amanha.getDate()); d <= FIM_AGENDA; d.setDate(d.getDate() + 1)) {
    if (d.getDay() === 0) continue;               // domingo fechado
    const dia = iso(d);
    const qtd = 4 + Math.floor(rnd() * 3);        // 4, 5 ou 6
    let feitos = 0;
    for (let tent = 0; feitos < qtd && tent < 80; tent++) {
      const h = HORARIOS[Math.floor(rnd() * HORARIOS.length)];
      const procId = procRodizio[iProc % procRodizio.length];
      const pr = db.procedimentos.find(x => x.id === procId);
      const pfId = especialista[pr.id] || (pr.id === 6 || pr.id === 3 ? 1 : [1, 1, 2, 3][Math.floor(rnd() * 4)]);
      const cad = [1, 2].find(c => !choqueAgenda(dia, h, pr.id, c, pfId));
      if (!cad) continue;
      iProc++; feitos++;
      const pa = db.pacientes[iPac++ % db.pacientes.length];
      const k = Math.round((d - hoje) / 86400000);
      db.agendamentos.push({id:idA++, paciente_id:pa.id, profissional_id:pfId, cadeira_id:cad,
        data:dia, hora:h, proc:pr.id, status: k <= 2 ? 'Confirmado' : 'Agendado', forma:null, pago:false,
        origem: rnd() < 0.3 ? 'Portal do paciente' : 'Recepção'});
    }
  }
  /* despesas do ano */
  const fixas = [['Aluguel do consultório','Fixas',3200],['Energia elétrica','Fixas',410],
                 ['Internet e telefonia','Fixas',210],['Contador','Fixas',650]];
  for (let m = 0; m <= hoje.getMonth(); m++) {
    fixas.forEach(f => {
      db.financeiro.push({id:idF++, tipo:'Despesa', desc:f[0], cat:f[1],
        valor:f[2] + Math.round(rnd()*60), data:iso(new Date(ANO, m, 5)),
        status:'Pago', forma:'Pix', paciente_id:null});
    });
    db.colaboradores.filter(c => c.ativo && c.salario > 0).forEach(c => {
      db.financeiro.push({id:idF++, tipo:'Despesa', desc:'Salário — ' + c.nome, cat:'Pessoal',
        valor:c.salario, data:iso(new Date(ANO, m, 5)), status:'Pago', forma:'Pix', paciente_id:null,
        ref:'sal:' + ANO + '-' + String(m + 1).padStart(2, '0') + ':' + c.id});
    });
    db.financeiro.push({id:idF++, tipo:'Despesa', desc:'Materiais odontológicos', cat:'Materiais',
      valor:600 + Math.round(rnd()*700), data:iso(new Date(ANO, m, 12)), status:'Pago',
      forma:'Cartão de crédito', paciente_id:null});
    if (m % 3 === 0) {
      db.financeiro.push({id:idF++, tipo:'Despesa', desc:'Manutenção de equipamentos',
        cat:'Equipamentos', valor:400 + Math.round(rnd()*400),
        data:iso(new Date(ANO, m, 20)), status:'Pago', forma:'Dinheiro', paciente_id:null});
    }
  }
  /* algumas pendências */
  db.financeiro.push({id:idF++, tipo:'Receita', desc:'Tratamento de canal — Rafael Barbosa (2ª parcela)',
    cat:'Procedimentos', valor:425, data:HOJE, status:'Pendente', forma:'Cartão de crédito', paciente_id:8});
  db.financeiro.push({id:idF++, tipo:'Despesa', desc:'Luvas e máscaras (reposição)', cat:'Materiais',
    valor:290, data:maisDias(-1), status:'Pendente', forma:'Pix', paciente_id:null});
})();

/* histórico de consumo e compras dos últimos 6 meses */
(function semearMovimentos(){
  let s = 987654321;
  const rnd = () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
  for (let k = 180; k >= 0; k -= 1) {
    const dia = maisDias(-k);
    if (dataDe(dia).getDay() === 0) continue;
    if (rnd() < 0.55) {
      const it = db.estoque[Math.floor(rnd() * db.estoque.length)];
      movimentar(it.id, 'Saída', 1 + Math.floor(rnd() * 3), 'Consumo em atendimento', dia);
    }
    if (rnd() < 0.10) {
      const it = db.estoque[Math.floor(rnd() * db.estoque.length)];
      movimentar(it.id, 'Entrada', 5 + Math.floor(rnd() * 15), 'Compra de reposição', dia);
    }
  }
})();

/* =====================================================================
   COMPONENTES DE GRÁFICO
   Barras finas, topo arredondado 4px ancorado na linha de base,
   rótulos diretos (nunca cor sozinha), grade recessiva.
   ===================================================================== */
function graficoColunas(dados, opcoes){
  /* dados: [{rotulo, valores:[n,...], detalhe}]  opcoes:{series:[{nome,cor}], fmt} */
  const o = opcoes || {};
  const series = o.series || [{nome:'', cor:'var(--serie-1)'}];
  const fmt = o.fmt || (v => String(v));
  const max = Math.max(1, ...dados.map(d => Math.max.apply(null, d.valores)));
  const box = el('div', {class:'gr'});

  if (series.length > 1) {
    box.appendChild(el('div', {class:'gr-legenda'},
      series.map(s => el('span', {},
        el('i', {style:'background:' + s.cor}), s.nome))));
  }

  const linhas = el('div', {class:'gr-linhas'},
    [0,25,50,75].map(p => el('div', {style:'top:' + p + '%'})));
  const cols = el('div', {class:'gr-cols'}, linhas,
    dados.map(d => {
      const grupo = el('div', {class:'gr-grupo'});
      grupo.appendChild(el('div', {class:'gr-tip'},
        d.rotulo + (d.detalhe ? ' · ' + d.detalhe : '') + ' — ' +
        series.map((s,i) => (s.nome ? s.nome + ' ' : '') + fmt(d.valores[i])).join(' · ')));
      if (series.length === 1 && o.rotularTopo) {
        grupo.appendChild(el('div', {class:'gr-rotulo'}, fmt(d.valores[0])));
      }
      series.forEach((s, i) => {
        const alt = Math.max(2, Math.round(d.valores[i] / max * 100));
        grupo.appendChild(el('div', {class:'gr-bar',
          style:'height:' + alt + '%;background:' + s.cor}));
      });
      return grupo;
    }));
  box.appendChild(cols);
  box.appendChild(el('div', {class:'gr-eixo'}, dados.map(d => el('div', {}, d.rotulo))));
  if (!o.semTotal) box.appendChild(el('div', {class:'gr-total'},
    series.map((sr, i) => el('span', {}, 'Total' + (sr.nome ? ' ' + sr.nome.toLowerCase() : '') + ': ',
      el('b', {}, fmt(dados.reduce((s, d) => s + (d.valores[i] || 0), 0)))))));
  return box;
}

function graficoBarrasH(itens, opcoes){
  /* itens: [{rotulo, valor, cor}] */
  const o = opcoes || {};
  const fmt = o.fmt || (v => String(v));
  const max = Math.max(1, ...itens.map(i => i.valor));
  return el('div', {class:'hbar-lista'}, itens.map(i =>
    el('div', {class:'hbar'},
      el('span', {style:'font-weight:600'}, i.rotulo),
      el('div', {class:'hbar-trilho'},
        el('i', {style:'width:' + Math.max(2, Math.round(i.valor / max * 100)) + '%;background:' +
                        (i.cor || 'var(--serie-1)')})),
      el('span', {class:'hbar-val'}, fmt(i.valor)))),
    o.total && itens.length ? el('div', {class:'hbar hbar-total'},
      el('span', {}, o.rotuloTotal || 'Total'), el('div', {}),
      el('span', {class:'hbar-val'}, fmt(itens.reduce((s, i) => s + i.valor, 0)))) : null);
}

let abaLogin = 'pac';
$('#aba-adm').addEventListener('click', () => { var ts = $('#tela-senha'); if (ts) { ts.style.display = 'grid'; var si = $('#senha-input'); if (si) si.focus(); } });
$('#aba-pac').addEventListener('click', () => { abaLogin = 'pac'; desenharLogin(); });

function desenharLogin(){
  $('#aba-adm').className = 'aba' + (abaLogin === 'adm' ? ' ativa' : '');
  $('#aba-pac').className = 'aba' + (abaLogin === 'pac' ? ' ativa' : '');
  const p = $('#painel-login'); p.innerHTML = '';
  if (abaLogin === 'adm') p.appendChild(formAdmin());
  else if (abaLogin === 'pac') p.appendChild(formPaciente());
  else if (abaLogin === 'cad') p.appendChild(formCadastro());
  else p.appendChild(formEsqueci());
}

function caixaMsg(){ return el('div', {class:'msg-erro hidden'}); }
function mostrar(box, texto, ok){
  box.className = ok ? 'msg-ok' : 'msg-erro';
  box.textContent = texto;
}

function campo(rotulo, tipo, valor, id){
  const inp = el('input', {class:'input', type:tipo, id:id, value:valor || ''});
  return {wrap: el('div', {style:'margin-bottom:14px'}, el('label', {class:'label'}, rotulo), inp), inp};
}

function formAdmin(){

  const email = campo('Login', 'text', '');

  const f = el('form', {onsubmit: async e => {
    e.preventDefault();
    if (email.inp.value.trim().toLowerCase() === CONTA_ADMIN.login &&
        (await hashSenha(senha.inp.value)) === ADMIN_HASH) {

    }

    el('button', {class:'btn btn-primary', style:'width:100%', type:'submit'}, 'Entrar no sistema'));

let tentativasPortal = 0, bloqueioPortalAte = 0;
function formPaciente(){
  const msg = caixaMsg();
  const cpf   = campo('CPF (seu login)', 'text', '');
  const senha = campo('Senha (sua data de nascimento)', 'password', '');
  const f = el('form', {onsubmit: e => {
    e.preventDefault();
    if (Date.now() < bloqueioPortalAte) {
      mostrar(msg, 'Muitas tentativas. Aguarde ' + Math.ceil((bloqueioPortalAte - Date.now()) / 1000) + ' s.'); return; }
    const cpfDig = soDigitos(cpf.inp.value);
    if (!cpfDig) { mostrar(msg, 'Informe o seu CPF.'); return; }
    const u = db.usuarios.find(x => soDigitos(x.cpf) === cpfDig);
    const senhaOk = u && (u.senha === normalizaSenha(senha.inp.value) || u.senha === senha.inp.value);
    if (!senhaOk) {
      if (++tentativasPortal >= 5) { bloqueioPortalAte = Date.now() + 30000; tentativasPortal = 0; }
      mostrar(msg, 'CPF ou senha incorretos. Se nunca trocou a senha, use a sua data de nascimento (ddmmaaaa).');
      return;
    }
    tentativasPortal = 0;
    if (!u.ativo) { mostrar(msg, 'Esta conta está bloqueada. Procure a recepção da clínica.'); return; }
    entrarPaciente(u);
  }}, msg, cpf.wrap, senha.wrap,
    el('button', {class:'btn btn-primary', style:'width:100%', type:'submit'}, 'Entrar'));

  return el('div', {},
    el('p', {class:'muted small', style:'margin:0 0 16px'},
      'Seu login é o ', el('strong', {}, 'CPF'), ' e a senha inicial é a sua ',
      el('strong', {}, 'data de nascimento'), ' (formato ddmmaaaa).'),
    f,
    el('div', {style:'display:flex;justify-content:space-between;gap:12px;margin-top:16px;flex-wrap:wrap'},
      el('button', {class:'link', onclick: () => { abaLogin = 'esq'; desenharLogin(); }},
        'Esqueci minha senha'),
      el('button', {class:'link', onclick: () => { abaLogin = 'cad'; desenharLogin(); }},
        'Criar minha conta')));
}

function formCadastro(){
  const msg = caixaMsg();
  const nome  = campo('Nome completo *', 'text', '');
  const cpf   = campo('CPF * (será o seu login)', 'text', '');
  const nasc  = campo('Data de nascimento * (será a sua senha)', 'date', '');
  const tel   = campo('Telefone', 'text', '');
  const email = campo('E-mail (para avisos)', 'email', '');

  const f = el('form', {onsubmit: e => {
    e.preventDefault();
    const v = k => k.inp.value.trim();
    if (!v(nome) || !v(cpf) || !v(nasc)) {
      mostrar(msg, 'Preencha todos os campos obrigatórios (*).'); return; }
    if (soDigitos(v(cpf)).length !== 11) {
      mostrar(msg, 'O CPF deve ter 11 dígitos.'); return; }
    if (db.usuarios.some(u => soDigitos(u.cpf) === soDigitos(v(cpf)))) {
      mostrar(msg, 'Não foi possível criar a conta com esses dados. Se você já tem conta, use "Entrar" ou "Esqueci minha senha".'); return; }

    /* se o CPF já existe como paciente, vincula; senão cria o paciente */
    let p = db.pacientes.find(x => x.cpf && soDigitos(x.cpf) === soDigitos(v(cpf)));
    /* CPF já cadastrado na clínica: só cria a conta se a data de nascimento conferir */
    if (p && p.nasc !== v(nasc)) {
      mostrar(msg, 'Não foi possível criar a conta com esses dados. Procure a recepção da clínica.'); return; }
    if (!p) {
      p = {id:proxId(db.pacientes), nome:v(nome), cpf:v(cpf), nasc:v(nasc),
           tel:v(tel) || null, email:v(email) || null, resp:null};
      db.pacientes.push(p);
    } else {
      if (v(email)) p.email = v(email);
      if (v(tel)) p.tel = v(tel);
    }
    const u = criarConta(p.id);
    abrirAviso('Conta criada com sucesso!',
      'Guarde seus dados de acesso:\n\nLogin (CPF): ' + p.cpf +
      '\nSenha (data de nascimento): ' + senhaPadrao(p) +
      '\n\nVocê pode trocar a senha depois em "Meus dados".', senhaPadrao(p),
      () => entrarPaciente(u));
  }}, msg, nome.wrap, cpf.wrap, nasc.wrap, tel.wrap, email.wrap,
    el('button', {class:'btn btn-primary', style:'width:100%', type:'submit'}, 'Criar conta e agendar'));

  return el('div', {},
    el('p', {class:'muted small', style:'margin:0 0 16px'},
      'Crie sua conta para marcar consultas pelo portal. Seu login será o ',
      el('strong', {}, 'CPF'), ' e a senha inicial será a sua ',
      el('strong', {}, 'data de nascimento'), ' no formato ddmmaaaa.'),
    f,
    el('div', {style:'text-align:center;margin-top:16px'},
      el('button', {class:'link', onclick: () => { abaLogin = 'pac'; desenharLogin(); }},
        'Já tenho conta — voltar para o login')));
}

function formEsqueci(){
  const msg = caixaMsg();
  const cpf  = campo('CPF da conta', 'text', '');
  const nasc = campo('Sua data de nascimento (confirmação)', 'date', '');

  const f = el('form', {onsubmit: e => {
    e.preventDefault();
    const u = db.usuarios.find(x => soDigitos(x.cpf) === soDigitos(cpf.inp.value));
    const p = u ? pac(u.paciente_id) : null;
    if (!u || !p || p.nasc !== nasc.inp.value) {
      mostrar(msg, 'CPF ou data de nascimento não conferem com o cadastro.'); return; }
    if (!u.ativo) { mostrar(msg, 'Esta conta está bloqueada. Procure a recepção da clínica.'); return; }
    u.senha = senhaPadrao(p); u.padrao = true; u.temporaria = false;
    abrirAviso('Senha restaurada',
      'Sua senha voltou a ser a data de nascimento. Entre com:\n\nCPF: ' + p.cpf,
      senhaPadrao(p), () => { abaLogin = 'pac'; desenharLogin(); });
  }}, msg, cpf.wrap, nasc.wrap,
    el('button', {class:'btn btn-primary', style:'width:100%', type:'submit'},
      'Restaurar minha senha'));

  const msg2 = caixaMsg();
  const cpf2 = campo('CPF da conta', 'text', '');
  const f2 = el('form', {onsubmit: e => {
    e.preventDefault();
    const u = db.usuarios.find(x => soDigitos(x.cpf) === soDigitos(cpf2.inp.value));
    if (u && !db.pedidosSenha.some(x => x.usuario_id === u.id && x.status === 'Pendente'))
      db.pedidosSenha.push({id:proxId(db.pedidosSenha), usuario_id:u.id, data:HOJE,
        hora:new Date().toTimeString().slice(0,5), status:'Pendente'});
    mostrar(msg2, 'Se houver uma conta com este CPF, o administrador da clínica vai gerar uma senha provisória.', true);
    cpf2.inp.value = '';
  }}, msg2, cpf2.wrap,
    el('button', {class:'btn btn-secondary', style:'width:100%', type:'submit'},
      'Pedir ajuda ao administrador'));

  return el('div', {},

      el('tbody', {}, lista.map(p => {

function modalPaciente(ed){
  abrirModal(ed ? 'Editar paciente' : 'Novo paciente', 'Os campos marcados com * são obrigatórios.', [
    ['nome','Nome completo *','text',true,'col-full'],
    ['cpf','CPF','text',false],
    ['nasc','Data de nascimento *','date',true],
    ['tel','Telefone','text',false],
    ['email','E-mail','email',false],
  ], v => {
    if (v.cpf && soDigitos(v.cpf).length !== 11) { toast('O CPF deve ter 11 dígitos.', 'warn'); return false; }
    if (v.cpf && db.pacientes.some(x => x !== ed && x.cpf && soDigitos(x.cpf) === soDigitos(v.cpf))) {
      toast('Já existe um paciente com este CPF.', 'warn'); return false; }
    if (v.nasc > HOJE) { toast('A data de nascimento não pode ser futura.', 'warn'); return false; }
    if (ed) {
      Object.assign(ed, {nome:v.nome, cpf:v.cpf || null, nasc:v.nasc, tel:v.tel || null, email:v.email || null});
      toast('Paciente atualizado.');
    } else {
      db.pacientes.push({id:proxId(db.pacientes), nome:v.nome, cpf:v.cpf || null, nasc:v.nasc,
        tel:v.tel || null, email:v.email || null, resp:null});
      toast('Paciente cadastrado com sucesso!');
    }
    irPara('pacientes');
  }, ed ? {nome:ed.nome, cpf:ed.cpf || '', nasc:ed.nasc, tel:ed.tel || '', email:ed.email || ''} : null);
}

function modalEvolucao(pid, redraw){
  abrirModal('Nova evolução clínica', 'Registro do atendimento no prontuário de ' + pac(pid).nome + '.', [
    ['data','Data *','date',true],
    ['profissional_id','Profissional *','select',true,null, db.profissionais.map(p => [p.id, p.nome])],
    ['dente','Dente (FDI, opcional)','text',false],
    ['descricao','Evolução *','text',true,'col-full'],
    ['conduta','Conduta *','text',true,'col-full'],
  ], v => {
    const d = v.dente ? parseInt(v.dente, 10) : null;
    const ok = d && ((d >= 11 && d <= 48 && d % 10 >= 1 && d % 10 <= 8) || (d >= 51 && d <= 85 && d % 10 >= 1 && d % 10 <= 5));
    if (v.dente && !ok) { toast('Informe um dente válido na notação FDI (ex.: 16, 36, 51).', 'warn'); return false; }
    if (v.data > HOJE) { toast('A evolução não pode ter data futura.', 'warn'); return false; }
    db.prontuarios.push({id:proxId(db.prontuarios), paciente_id:pid, data:v.data,
      profissional_id:Number(v.profissional_id), dente: d ? String(d) : '—',
      descricao:v.descricao, conduta:v.conduta});
    toast('Evolução registrada.');
    if (redraw) redraw();
  });
}

function modalAgendamento(){
  abrirModal('Novo agendamento', 'Selecione paciente, profissional, data e horário.', [
    ['paciente_id','Paciente *','select',true,'col-full', db.pacientes.map(p => [p.id, p.nome])],
    ['profissional_id','Profissional *','select',true,null, db.profissionais.map(p => [p.id, p.nome])],
    ['proc','Procedimento *','select',true,null,
      db.procedimentos.map(p => [p.id, p.nome + ' — ' + moeda(p.valor)])],
    ['data','Data *','date',true],
    ['hora','Horário *','time',true],
    ['cadeira_id','Cadeira *','select',true,null, db.cadeiras.map(x => [x.id, x.nome])],
  ], v => {
    const conflito = choqueAgenda(v.data, v.hora, v.proc, v.cadeira_id, v.profissional_id);
    if (conflito) {
      const quem = conflito.cadeira_id === Number(v.cadeira_id) ? 'essa cadeira' : 'esse profissional';
      toast('Conflito: ' + quem + ' já está ocupado das ' + conflito.hora + ' por ' +

    if (dataDe(v.data).getDay() === 0) { toast('A clínica não atende aos domingos.', 'warn'); return false; }
    if (v.hora < '08:00' || v.hora > '17:00') { toast('Horário fora do expediente (início entre 08:00 e 17:00).', 'warn'); return false; }
    db.agendamentos.push({id:proxId(db.agendamentos), paciente_id:Number(v.paciente_id),
      profissional_id:Number(v.profissional_id), cadeira_id:Number(v.cadeira_id),
      data:v.data, hora:v.hora, proc:Number(v.proc), status:'Agendado',
      forma:null, pago:false, origem:'Recepção'});

    toast('Agendamento criado!');
    irPara('agenda');
  });

function odtAtendidos(pid){
  const s = new Set();
  (db.prontuarios || []).forEach(r => { if (r.paciente_id === pid) {
    const n = parseInt(r.dente, 10); if (n >= 11 && n <= 85) s.add(n);
  }});
  (db.agendamentos || []).forEach(a => { if (a.paciente_id === pid && a.dente) {
    const n = parseInt(a.dente, 10); if (n >= 11 && n <= 85) s.add(n);
  }});
  return s;
}
const ODT_FACES = [['M','Mesial'],['D','Distal'],['O','Oclusal / Incisal'],['V','Vestibular'],['L','Lingual / Palatina']];
const ODT_SUP   = [18,17,16,15,14,13,12,11,21,22,23,24,25,26,27,28];
const ODT_INF   = [48,47,46,45,44,43,42,41,31,32,33,34,35,36,37,38];
const ODT_SUP_D = [55,54,53,52,51,61,62,63,64,65];
const ODT_INF_D = [85,84,83,82,81,71,72,73,74,75];
const odtModoPorPac = {};

function odtGet(pid, n){
  const raw = (db.odontograma[pid] || {})[n];
  if (!raw) return {estado:'higido', faces:[], nota:''};
  if (typeof raw === 'string') return {estado:raw, faces:[], nota:''};
  return {estado: raw.estado || 'higido', faces: raw.faces || [], nota: raw.nota || ''};
}
function odtSet(pid, n, obj){
  const mapa = db.odontograma[pid] = db.odontograma[pid] || {};
  if (obj.estado === 'higido' && (!obj.faces || !obj.faces.length) && !obj.nota) delete mapa[n];
  else mapa[n] = {estado: obj.estado, faces: obj.faces || [], nota: obj.nota || ''};
}


/* ---------------------------------------------------------------------
   Odontograma anatômico 3D — arcadas em vista oclusal (numeração FDI)
   Mesmos dados do odontograma em grade: estado, faces, observação e
   marcação de atendimento. Clique/Enter abre o mesmo modal de edição.
   --------------------------------------------------------------------- */
let odtVista = '3d';
const ODT_GRUPO_COR = {inc:'#d97706', can:'#16a34a', pre:'#9333ea', mol:'#2563eb'};
const ODT_GRUPO_NOME = {inc:'Incisivos', can:'Caninos', pre:'Pré-molares', mol:'Molares'};

function odtInfoDente(n){
  const q = Math.floor(n / 10), p = n % 10, dec = q >= 5;
  let tipo, grupo;
  if (p <= 2) { grupo = 'inc'; tipo = (p === 1 ? 'Incisivo central' : 'Incisivo lateral'); }
  else if (p === 3) { grupo = 'can'; tipo = 'Canino'; }
  else if (dec) { grupo = 'mol'; tipo = (p === 4 ? 'Primeiro molar' : 'Segundo molar'); }
  else if (p <= 5) { grupo = 'pre'; tipo = (p === 4 ? 'Primeiro pré-molar' : 'Segundo pré-molar'); }
  else { grupo = 'mol'; tipo = p === 6 ? 'Primeiro molar' : p === 7 ? 'Segundo molar' : 'Terceiro molar (siso)'; }
  const sup = (q === 1 || q === 2 || q === 5 || q === 6);
  const dir = (q === 1 || q === 4 || q === 5 || q === 8);
  return {grupo, tipo, dec,
    nome: tipo + ' ' + (sup ? 'superior' : 'inferior') + ' ' + (dir ? 'direito' : 'esquerdo') + (dec ? ' (decíduo)' : '')};
}
/* proporções aproximadas: largura mesiodistal e profundidade vestíbulo-lingual */
const ODT_FORMA = {inc1:[1.00,.92], inc2:[.84,.86], can:[.92,1.02], pre:[.9,1.06], mol:[1.2,1.14], molD:[1.05,1.04]};
function odtForma(n){
  const p = n % 10, dec = n >= 50;
  if (p === 1) return ODT_FORMA.inc1;
  if (p === 2) return ODT_FORMA.inc2;
  if (p === 3) return ODT_FORMA.can;
  if (dec) return ODT_FORMA.molD;
  return p <= 5 ? ODT_FORMA.pre : ODT_FORMA.mol;
}

const SVGNS = 'http://www.w3.org/2000/svg';
function sv(tag, attrs, ...kids){
  const n = document.createElementNS(SVGNS, tag);
  for (const k in (attrs || {})) {
    const v = attrs[k];
    if (v === null || v === undefined || v === false) continue;
    if (k.slice(0,2) === 'on') n.addEventListener(k.slice(2).toLowerCase(), v);
    else n.setAttribute(k, v);
  }
  kids.flat(3).forEach(k => { if (k != null && k !== false) n.appendChild(typeof k === 'object' ? k : document.createTextNode(String(k))); });
  return n;
}

/* posiciona os dentes ao longo de uma semi-elipse, proporcional à largura de cada dente */
function odtLayoutArco(lista, cx, cy, A, B, thMax, superior){
  const N = 400, pts = [], acc = [0];
  for (let i = 0; i <= N; i++) {
    const t = -thMax + 2 * thMax * i / N;
    pts.push([cx + A * Math.sin(t), superior ? cy - B * Math.cos(t) : cy + B * Math.cos(t), t]);
    if (i) acc.push(acc[i-1] + Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]));
  }
  const L = acc[N], larg = lista.map(n => odtForma(n)[0]);
  const esc = L / larg.reduce((a, b) => a + b, 0);
  let s = 0;
  return lista.map((n, i) => {
    const alvo = s + larg[i] * esc / 2; s += larg[i] * esc;
    let j = 1; while (j < N && acc[j] < alvo) j++;
    const f = (alvo - acc[j-1]) / ((acc[j] - acc[j-1]) || 1);
    const x = pts[j-1][0] + (pts[j][0] - pts[j-1][0]) * f;
    const y = pts[j-1][1] + (pts[j][1] - pts[j-1][1]) * f;
    const t = pts[j-1][2] + (pts[j][2] - pts[j-1][2]) * f;
    let nx = B * Math.sin(t), ny = superior ? -A * Math.cos(t) : A * Math.cos(t);
    const nl = Math.hypot(nx, ny); nx /= nl; ny /= nl;          // normal para fora (vestibular)
    return {n, x, y, nx, ny, w: larg[i] * esc * 0.95, d: odtForma(n)[1] * esc * 0.9,
            ang: Math.atan2(ny, nx) * 180 / Math.PI - 90};
  });
}

/* contorno oclusal de cada tipo de dente (coordenadas locais; +y = vestibular) */
function odtContorno(n, w, d){
  const p = n % 10, dec = n >= 50, hw = w / 2, hd = d / 2;
  if (p <= 2) return {forma:`M ${-hw} ${hd*0.15} C ${-hw} ${-hd*0.9}, ${hw} ${-hd*0.9}, ${hw} ${hd*0.15}
      C ${hw} ${hd*1.05}, ${-hw} ${hd*1.05}, ${-hw} ${hd*0.15} Z`,
    sulcos:`M ${-hw*0.62} ${hd*0.32} Q 0 ${hd*0.52} ${hw*0.62} ${hd*0.32}`};
  if (p === 3) return {forma:`M 0 ${-hd} C ${hw*0.95} ${-hd*0.85}, ${hw*1.05} ${hd*0.35}, 0 ${hd}
      C ${-hw*1.05} ${hd*0.35}, ${-hw*0.95} ${-hd*0.85}, 0 ${-hd} Z`,
    sulcos:`M ${-hw*0.42} ${-hd*0.1} L 0 ${hd*0.38} L ${hw*0.42} ${-hd*0.1} M 0 ${hd*0.38} L 0 ${-hd*0.55}`};
  if (p <= 5 && !dec) return {forma:`M ${-hw} 0 C ${-hw} ${-hd*1.08}, ${hw} ${-hd*1.08}, ${hw} 0
      C ${hw} ${hd*1.08}, ${-hw} ${hd*1.08}, ${-hw} 0 Z`,
    sulcos:`M ${-hw*0.55} ${hd*0.04} Q 0 ${-hd*0.16} ${hw*0.55} ${hd*0.04}`};
  const r = Math.min(hw, hd) * 0.62;
  return {forma:`M ${-hw+r} ${-hd} L ${hw-r} ${-hd} Q ${hw} ${-hd} ${hw} ${-hd+r} L ${hw} ${hd-r} Q ${hw} ${hd} ${hw-r} ${hd}
      L ${-hw+r} ${hd} Q ${-hw} ${hd} ${-hw} ${hd-r} L ${-hw} ${-hd+r} Q ${-hw} ${-hd} ${-hw+r} ${-hd} Z`,
    sulcos:`M ${-hw*0.62} ${hd*0.06} Q ${-hw*0.2} ${-hd*0.12} ${hw*0.05} ${hd*0.02} T ${hw*0.62} ${-hd*0.04}
      M ${-hw*0.08} ${-hd*0.62} Q ${hw*0.06} ${-hd*0.1} ${-hw*0.04} ${hd*0.02} T ${hw*0.08} ${hd*0.62}`};
}

function odtArcada3D(pid, modo, sup, inf, atend, redraw){
  const W = 470, H = 600, cx = W / 2;
  const geo = modo === 'infantil'
    ? {sup: odtLayoutArco(sup, cx, 236, 138, 172, 1.30, true), inf: odtLayoutArco(inf, cx, 358, 132, 172, 1.30, false), arcS:[236,138,172], arcI:[358,132,172]}
    : {sup: odtLayoutArco(sup, cx, 254, 166, 202, 1.36, true), inf: odtLayoutArco(inf, cx, 344, 158, 202, 1.36, false), arcS:[254,166,202], arcI:[344,158,202]};

  const curva = (cy, A, B, sup, th, k) => {
    const pts = [], a = A + k, bb = B + k;
    for (let i = 0; i <= 60; i++) { const t = -th + 2 * th * i / 60;
      pts.push((i ? 'L ' : 'M ') + (cx + a * Math.sin(t)).toFixed(1) + ' ' + (sup ? cy - bb * Math.cos(t) : cy + bb * Math.cos(t)).toFixed(1)); }
    return pts.join(' ');
  };
  /* interior fechado da arcada (palato / assoalho), com borda posterior arredondada */
  const interior = (cy, A, B, sup, th, k) => {
    const a = A + k, bb = B + k, yEnd = sup ? cy - bb * Math.cos(th) : cy + bb * Math.cos(th);
    const xL = cx - a * Math.sin(th), xR = cx + a * Math.sin(th), dy = sup ? 34 : -34;
    return curva(cy, A, B, sup, th, k) + ` C ${xR} ${yEnd + dy}, ${xL} ${yEnd + dy}, ${xL} ${yEnd} Z`;
  };
  const thM = 1.42;
  const defs = sv('defs', {},
    sv('radialGradient', {id:'odtEsmalte', cx:'38%', cy:'32%', r:'75%'},
      sv('stop', {offset:'0', 'stop-color':'#ffffff'}), sv('stop', {offset:'.5', 'stop-color':'#f7f2e8'}),
      sv('stop', {offset:'.85', 'stop-color':'#e2d7c3'}), sv('stop', {offset:'1', 'stop-color':'#c9bba3'})),
    sv('radialGradient', {id:'odtPalato', cx:'50%', cy:'35%', r:'70%'},
      sv('stop', {offset:'0', 'stop-color':'#f2a9ad'}), sv('stop', {offset:'1', 'stop-color':'#d9737c'})),
    sv('radialGradient', {id:'odtLingua', cx:'50%', cy:'60%', r:'65%'},
      sv('stop', {offset:'0', 'stop-color':'#f4a3a6'}), sv('stop', {offset:'1', 'stop-color':'#d8707a'})),
    sv('filter', {id:'odtSombra', x:'-40%', y:'-40%', width:'180%', height:'180%'},
      sv('feDropShadow', {dx:'0', dy:'2.2', stdDeviation:'1.8', 'flood-color':'#5b1f2a', 'flood-opacity':'.38'})),
    sv('filter', {id:'odtBrilho', x:'-60%', y:'-60%', width:'220%', height:'220%'},
      sv('feGaussianBlur', {stdDeviation:'3.2'})));

  const gengiva = (cy, A, B, s) => [
    sv('path', {d: curva(cy, A, B, s, thM, 0), fill:'none', stroke:'#b9505c', 'stroke-width':'64', 'stroke-linecap':'round', 'stroke-linejoin':'round'}),
    sv('path', {d: curva(cy, A, B, s, thM, 0), fill:'none', stroke:'#df7f86', 'stroke-width':'54', 'stroke-linecap':'round', 'stroke-linejoin':'round'}),
    sv('path', {d: curva(cy, A, B, s, thM, 22), fill:'none', stroke:'rgba(255,255,255,.22)', 'stroke-width':'5', 'stroke-linecap':'round'})];
  const [sCy, sA, sB] = geo.arcS, [iCy, iA, iB] = geo.arcI;
  const palato = sv('g', {'aria-hidden':'true'},
    sv('path', {d: interior(sCy, sA, sB, true, thM - 0.06, -24), fill:'url(#odtPalato)'}),
    [0.32, 0.47, 0.62].map((f, i) => sv('path', {d:`M ${cx-sA*0.42+i*6} ${sCy-sB*f} Q ${cx} ${sCy-sB*f-14} ${cx+sA*0.42-i*6} ${sCy-sB*f}`,
      fill:'none', stroke:'rgba(255,235,236,.45)', 'stroke-width':'3', 'stroke-linecap':'round'})),
    sv('path', {d:`M ${cx} ${sCy-sB*0.74} L ${cx} ${sCy-sB*0.05}`, stroke:'rgba(160,60,72,.25)', 'stroke-width':'2'}));
  const lingua = sv('g', {'aria-hidden':'true'},
    sv('path', {d: interior(iCy, iA, iB, false, thM - 0.06, -24), fill:'#c7606b'}),
    sv('ellipse', {cx, cy: iCy + iB*0.47, rx: iA*0.58, ry: iB*0.43, fill:'url(#odtLingua)'}),
    sv('path', {d:`M ${cx} ${iCy+iB*0.02} L ${cx} ${iCy+iB*0.62}`, stroke:'rgba(160,60,72,.28)', 'stroke-width':'2', 'stroke-linecap':'round'}));

  const info = el('div', {class:'odt3d-info', 'aria-live':'polite'});
  let fixo = null;
  const legGrupos = el('div', {class:'odt3d-grupos'}, Object.keys(ODT_GRUPO_NOME).map(g =>
    el('span', {}, el('i', {style:'background:' + ODT_GRUPO_COR[g]}), ODT_GRUPO_NOME[g])));
  function mostrar(n){
    info.innerHTML = '';
    if (n == null) {
      info.append(el('h4', {}, 'Arcadas'),
        el('p', {class:'odt3d-tipo'}, modo === 'infantil' ? 'Dentição decídua (20 dentes)' : 'Dentição permanente (32 dentes)'),
        el('p', {class:'odt3d-vazio'}, 'Passe o mouse sobre um dente para ver os detalhes. Clique, ou use Tab e Enter, para registrar ou editar.'),
        legGrupos);
      return;
    }
    const d = odtGet(pid, n), at = atend.has(n), id = odtInfoDente(n);
    const ef = (d.estado === 'higido' && at) ? 'atendido' : d.estado, c = ODT_STATUS[ef];
    const nomesF = d.faces.map(f => (ODT_FACES.find(x => x[0] === f) || [f, f])[1]);
    info.append(el('h4', {}, 'Dente ' + n), el('p', {class:'odt3d-tipo'}, id.nome),
      el('span', {class:'odt3d-estado', style:'background:' + c[1] + ';color:' + c[2] + ';border-color:' + c[2]}, c[0]),
      el('dl', {},
        el('dt', {}, 'Faces'), el('dd', {}, nomesF.length ? nomesF.join(', ') : 'Nenhuma marcada'),
        el('dt', {}, 'Atendimento'), el('dd', {}, at ? 'Sim, há registro' : 'Nenhum registro'),
        el('dt', {}, 'Observação'), el('dd', {}, d.nota || 'Sem observação')),
      el('button', {class:'btn btn-sm btn-primary', onclick: () => modalDente(pid, n, redraw, modo)}, 'Editar dente ' + n),
      legGrupos);
  }

  function dente(g){
    const {n, x, y, nx, ny, w, d: dp, ang} = g;
    const reg = odtGet(pid, n), at = atend.has(n), id = odtInfoDente(n);
    const ef = (reg.estado === 'higido' && at) ? 'atendido' : reg.estado, c = ODT_STATUS[ef];
    const aus = reg.estado === 'ausente', hig = ef === 'higido';
    const ct = odtContorno(n, w, dp);
    const corpo = sv('g', {class:'odt3d-corpo'},
      sv('path', {class:'odt3d-foco', d: ct.forma, fill:'none', stroke:'#1f85f5', 'stroke-width':'7', opacity:'0', filter:'url(#odtBrilho)'}),
      aus
        ? sv('path', {d: ct.forma, fill:'rgba(255,255,255,.35)', stroke:'#6b7280', 'stroke-width':'1.6', 'stroke-dasharray':'3 3'})
        : [sv('path', {d: ct.forma, fill:'url(#odtEsmalte)', filter:'url(#odtSombra)'}),
           hig ? null : sv('path', {d: ct.forma, fill: c[1], style:'mix-blend-mode:multiply', opacity:'.95'}),
           hig ? null : sv('path', {d: ct.forma, fill: c[2], opacity:'.14'}),
           sv('path', {d: ct.sulcos, fill:'none', stroke: hig ? 'rgba(128,104,72,.5)' : c[2], 'stroke-opacity': hig ? 1 : .55, 'stroke-width':'1.3', 'stroke-linecap':'round'}),
           sv('ellipse', {cx: -w*0.17, cy: -dp*0.2, rx: w*0.17, ry: dp*0.11, fill:'#fff', opacity:'.75'}),
           sv('path', {d: ct.forma, fill:'none', stroke: hig ? '#bfae92' : c[2], 'stroke-width': hig ? 1.1 : 1.9})],
      at ? sv('path', {d: ct.forma, fill:'none', stroke:'#0369a1', 'stroke-width':'1.6', 'stroke-dasharray':'2.5 2.5', transform:'scale(1.22)'}) : null,
      reg.nota ? sv('circle', {cx: w*0.32, cy: -dp*0.3, r:'3.4', fill: c[2], stroke:'#fff', 'stroke-width':'1.2'}) : null);
    const ox = nx * (dp / 2 + 17), oy = ny * (dp / 2 + 17);
    const rot = sv('g', {transform:`translate(${x.toFixed(1)} ${y.toFixed(1)})`},
      sv('g', {transform:`rotate(${ang.toFixed(1)})`, style:`--lx:0px;--ly:${(6).toFixed(1)}px`}, corpo),
      sv('text', {class:'odt3d-num', x: ox.toFixed(1), y: (oy + 4).toFixed(1), 'text-anchor':'middle', fill: ODT_GRUPO_COR[id.grupo]}, String(n)),
      reg.faces.length ? sv('text', {class:'odt3d-fc', x: (ox + nx*12).toFixed(1), y: (oy + ny*12 + 3).toFixed(1), 'text-anchor':'middle'}, reg.faces.join('')) : null);
    const titulo = 'Dente ' + n + ', ' + id.nome + ', ' + c[0] + (reg.faces.length ? ', faces ' + reg.faces.join(' ') : '') +
      (at ? ', com atendimento' : '') + (reg.nota ? ', observação: ' + reg.nota : '');
    const grp = sv('g', {class:'odt3d-dente', tabindex:'0', role:'button', 'aria-label': titulo,
      onclick: () => modalDente(pid, n, redraw, modo),
      onkeydown: e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); modalDente(pid, n, redraw, modo); } },
      onmouseenter: () => mostrar(n), onfocus: () => { fixo = n; mostrar(n); },
      onmouseleave: () => mostrar(fixo), onblur: () => { fixo = null; mostrar(null); }},
      sv('title', {}, titulo), rot);
    return grp;
  }

  const lado = (txt, x, y, anchor) => sv('text', {class:'odt3d-lado', x, y, 'text-anchor':anchor}, txt);
  const svg = sv('svg', {class:'odt3d-svg', viewBox:`0 0 ${W} ${H}`, role:'group',
      'aria-label':'Odontograma: arcada superior (maxila) e inferior (mandíbula), vista oclusal'},
    defs,
    gengiva(sCy, sA, sB, true), palato,
    gengiva(iCy, iA, iB, false), lingua,
    sv('text', {class:'odt3d-rot', x: W - 14, y: 30, 'text-anchor':'end'}, 'Maxila'),
    sv('text', {class:'odt3d-rot', x: W - 14, y: H - 12, 'text-anchor':'end'}, 'Mandíbula'),
    lado('Lado direito', 14, (sCy + iCy) / 2 + 4, 'start'),
    lado('Lado esquerdo', W - 14, (sCy + iCy) / 2 + 4, 'end'),
    geo.sup.map(dente), geo.inf.map(dente));

  const stage = el('div', {class:'odt3d-stage'}, svg);
  const calmo = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!calmo) {
    stage.addEventListener('pointermove', e => {
      const r = stage.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width - .5, py = (e.clientY - r.top) / r.height - .5;
      svg.style.setProperty('--ry', (px * 9).toFixed(2) + 'deg');
      svg.style.setProperty('--rx', (-py * 7 + 4).toFixed(2) + 'deg');
    });
    stage.addEventListener('pointerleave', () => { svg.style.setProperty('--ry', '0deg'); svg.style.setProperty('--rx', '0deg'); });
  }
  mostrar(null);
  return el('div', {class:'odt3d'}, stage, info);
}

function odontograma(pid, redraw){
  db.odontograma = db.odontograma || {};
  const atend = odtAtendidos(pid);
  const p = pac(pid);
  const modo = odtModoPorPac[pid] || (idade(p.nasc) < 13 ? 'infantil' : 'adulto');
  const sup = modo === 'infantil' ? ODT_SUP_D : ODT_SUP;
  const inf = modo === 'infantil' ? ODT_INF_D : ODT_INF;

  function dente(n){
    const d = odtGet(pid, n), at = atend.has(n);
    const estadoEff = (d.estado === 'higido' && at) ? 'atendido' : d.estado;
    const cfg = ODT_STATUS[estadoEff];
    return el('button', {class:'odt-dente' + (d.nota ? ' has-nota' : '') + (at ? ' atendido' : ''),
      title:'Dente ' + n + ' · ' + cfg[0] + (at ? ' · com atendimento' : '') +
            (d.faces.length ? ' (' + d.faces.join('') + ')' : '') + (d.nota ? ' · ' + d.nota : ''),
      style:'background:' + cfg[1] + ';color:' + cfg[2] +
            (d.estado === 'ausente' ? ';text-decoration:line-through;opacity:.65' : ''),
      onclick: () => modalDente(pid, n, redraw, modo)},
      el('span', {class:'odt-num'}, String(n)),
      d.faces.length ? el('span', {class:'odt-faces'}, d.faces.join('')) : null);
  }

  const arco = list => {
    const row = el('div', {class:'odt-arco'});
    list.forEach((n, i) => {
      if (i === list.length / 2) row.appendChild(el('span', {class:'odt-mid'}));
      row.appendChild(dente(n));
    });
    return row;
  };

  const btnModo = m => el('button',
    {class:'btn btn-sm ' + (modo === m ? 'btn-primary' : 'btn-secondary'),
     onclick: () => { odtModoPorPac[pid] = m; if (redraw) redraw(); }},
    m === 'adulto' ? 'Permanentes' : 'Decíduos (leite)');

  const card = el('div', {class:'card', style:'margin-bottom:18px'},
    el('div', {class:'odt-toolbar'},
      el('h3', {class:'secao-titulo', style:'margin:0'}, 'Odontograma'),
      el('div', {style:'display:flex;gap:8px;flex-wrap:wrap;align-items:center'},
        btnModo('adulto'), btnModo('infantil'),
        el('button', {class:'btn btn-sm btn-secondary', title:'Alternar entre arcada anatômica e grade',
          onclick: () => { odtVista = odtVista === '3d' ? 'grade' : '3d'; if (redraw) redraw(); }},
          odtVista === '3d' ? 'Ver em grade' : 'Ver arcada 3D'),
        el('button', {class:'btn btn-sm btn-secondary', onclick: () => imprimirOdontograma(pid)}, '🖨 Imprimir'),
        el('button', {class:'btn btn-sm btn-primary', onclick: () => modalDente(pid, null, redraw, modo)},
          '+ Registrar dente'))),
    el('p', {class:'muted small', style:'margin:2px 0 8px'},
      'Clique em um dente para editar, ou use “+ Registrar dente” para criar um novo registro.'),
    odtVista === '3d'
      ? odtArcada3D(pid, modo, sup, inf, atend, redraw)
      : [el('div', {class:'odt-arcada'}, el('span', {class:'odt-arc-lbl'}, 'Arcada superior'), arco(sup)),
         el('div', {class:'odt-arcada'}, el('span', {class:'odt-arc-lbl'}, 'Arcada inferior'), arco(inf))],
    el('div', {class:'odt-legenda'}, ODT_LEGENDA.map(k => el('span', {class:'odt-leg'},
      el('i', {style:'background:' + ODT_STATUS[k][1] + ';border-color:' + ODT_STATUS[k][2]}),
      ODT_STATUS[k][0]))));

  const mapa = db.odontograma[pid] || {};
  const cont = {};
  Object.keys(mapa).forEach(n => { const e = odtGet(pid, n).estado; cont[e] = (cont[e] || 0) + 1; });
  const resumo = ODT_ORDEM.filter(k => k !== 'higido' && cont[k])
    .map(k => cont[k] + ' ' + ODT_STATUS[k][0].toLowerCase()).join(' · ');
  const nAt = atend.size;
  const partes = [];
  if (nAt) partes.push(nAt + (nAt === 1 ? ' dente com atendimento' : ' dentes com atendimento'));
  if (resumo) partes.push(resumo);
  card.appendChild(el('p', {class:'muted small', style:'margin:12px 0 0'},
    'Resumo: ' + (partes.join(' · ') || 'nenhuma alteração registrada — todos os dentes hígidos')));
  const visiveis = new Set(sup.concat(inf));
  const fora = Object.keys(mapa).map(Number).filter(n => !visiveis.has(n));
  if (fora.length) card.appendChild(el('p', {class:'small', style:'margin:6px 0 0;color:var(--warn)'},
    'Há registro em dente da outra dentição: ' + fora.sort((a, b) => a - b).join(', ') +
    '. Use o botão ' + (modo === 'infantil' ? '"Permanentes"' : '"Decíduos (leite)"') + ' para ver.'));
  return card;
}

function modalDente(pid, n, redraw, modo){
  const criar = (n == null);
  let dente = n;
  const cur = criar ? {estado:'higido', faces:[], nota:''} : odtGet(pid, n);
  let estado = cur.estado, faces = cur.faces.slice();

  const optEstado = el('div', {class:'odt-opts'});
  ODT_ORDEM.forEach(k => {
    const b = el('button', {class:'odt-opt' + (k === estado ? ' sel' : ''),
      style:'background:' + ODT_STATUS[k][1] + ';color:' + ODT_STATUS[k][2],
      onclick: () => { estado = k;
        optEstado.querySelectorAll('.odt-opt').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); }},
      ODT_STATUS[k][0]);
    optEstado.appendChild(b);
  });

  const chips = el('div', {class:'odt-chips'});
  ODT_FACES.forEach(fc => {
    const b = el('button', {class:'odt-chip' + (faces.includes(fc[0]) ? ' on' : ''), title:fc[1],
      onclick: () => { faces.includes(fc[0]) ? faces = faces.filter(x => x !== fc[0]) : faces.push(fc[0]);
        b.classList.toggle('on'); }}, fc[0]);
    chips.appendChild(b);
  });

  const ta = el('textarea', {class:'input', style:'min-height:70px',
    placeholder:'Observação clínica (opcional): procedimento, material, data...'});
  ta.value = cur.nota;

  let seletor = null;
  if (criar) {
    const todos = [['Permanentes', ODT_SUP.concat(ODT_INF)], ['Decíduos (leite)', ODT_SUP_D.concat(ODT_INF_D)]];
    seletor = el('select', {class:'input', onchange: e => { dente = Number(e.target.value); }},
      el('option', {value:''}, 'Selecione o dente...'),
      todos.map(g => el('optgroup', {label:g[0]}, g[1].map(t => el('option', {value:String(t)}, 'Dente ' + t)))));
  }

  const bg = el('div', {class:'modal-bg', onclick: e => { if (e.target === bg) bg.remove(); }});
  bg.appendChild(el('div', {class:'modal', style:'max-width:540px'},
    el('h3', {}, criar ? 'Registrar dente' : 'Dente ' + n),
    el('p', {class:'sub'}, 'Estado clínico, faces afetadas e observação.'),
    criar ? el('label', {class:'label'}, 'Dente') : null,
    criar ? seletor : null,
    el('label', {class:'label', style:'margin-top:10px;display:block'}, 'Estado'), optEstado,
    el('label', {class:'label', style:'margin-top:10px;display:block'}, 'Faces afetadas'), chips,
    el('label', {class:'label', style:'margin-top:10px;display:block'}, 'Observação'), ta,
    el('div', {class:'modal-acoes'},
      el('button', {class:'btn btn-secondary', onclick: () => bg.remove()}, 'Cancelar'),
      el('button', {class:'btn btn-primary', onclick: () => {
        if (criar && !dente) { toast('Escolha o dente.', 'warn'); return; }
        odtSet(pid, dente, {estado: estado, faces: faces, nota: ta.value.trim()});
        bg.remove(); toast('Dente ' + dente + ' registrado.'); if (redraw) redraw();
      }}, 'Salvar'))));
  $('#modais').appendChild(bg);
}

function imprimirOdontograma(pid){
  if (!document.getElementById('odt-print-style')) {
    const st = document.createElement('style'); st.id = 'odt-print-style';
    st.textContent = '#odt-print{display:none}' +
      '@media print{body:has(#odt-print)>*{display:none!important}' +
      'body:has(#odt-print)>#odt-print{display:block!important}}';
    document.head.appendChild(st);
  }
  const antigo = document.getElementById('odt-print'); if (antigo) antigo.remove();
  const p = pac(pid);
  const modo = odtModoPorPac[pid] || (idade(p.nasc) < 13 ? 'infantil' : 'adulto');
  const sup = modo === 'infantil' ? ODT_SUP_D : ODT_SUP;
  const inf = modo === 'infantil' ? ODT_INF_D : ODT_INF;
  const atend = odtAtendidos(pid);
  const EXATO = ';-webkit-print-color-adjust:exact;print-color-adjust:exact';

  const box = n => {
    const d = odtGet(pid, n), at = atend.has(n);
    const est = (d.estado === 'higido' && at) ? 'atendido' : d.estado, cfg = ODT_STATUS[est];
    return el('div', {style:'width:40px;min-height:44px;border:1.5px solid ' + (at ? '#0369a1' : 'rgba(0,0,0,.28)') +
      ';border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;' +
      'font:700 12px Arial;background:' + cfg[1] + ';color:' + cfg[2] + EXATO +
      (d.estado === 'ausente' ? ';text-decoration:line-through' : '')},
      String(n), d.faces.length ? el('div', {style:'font-size:8px;font-weight:800'}, d.faces.join('')) : null);
  };
  const arco = list => {
    const r = el('div', {style:'display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin:6px 0'});
    list.forEach((n, i) => { if (i === list.length / 2) r.appendChild(el('div', {style:'width:2px;background:#bbb;margin:0 4px'})); r.appendChild(box(n)); });
    return r;
  };
  const lbl = 'text-align:center;font:800 11px Arial;letter-spacing:.08em;text-transform:uppercase;color:#555;margin-top:8px';

  const linhas = [];
  ODT_SUP.concat(ODT_INF, ODT_SUP_D, ODT_INF_D).forEach(n => {
    const d = odtGet(pid, n), at = atend.has(n);
    if (d.estado !== 'higido' || d.faces.length || d.nota || at)
      linhas.push([n, ODT_STATUS[d.estado][0], d.faces.join(', ') || '—', at ? 'Sim' : '—', d.nota || '—']);
  });

  const cont = el('div', {id:'odt-print', style:'padding:12px 8px;font-family:Arial,Helvetica,sans-serif;color:#111'});
  cont.appendChild(el('div', {style:'display:flex;gap:14px;align-items:center;border-bottom:2px solid #1d4ed8;padding-bottom:10px;margin-bottom:14px'},
    el('img', {src:'logo-medflow.png', alt:'', style:'width:56px;height:56px;object-fit:cover;border-radius:10px'}),
    el('div', {},
      el('div', {style:'font-size:18px;font-weight:800'}, db.clinica.nome + ' — Clínica Odontológica'),
      el('div', {style:'font-size:12px;color:#444'}, 'CNPJ ' + db.clinica.cnpj + ' · ' + db.clinica.endereco),
      el('div', {style:'font-size:12px;color:#444'}, 'Responsável técnica: ' + db.clinica.responsavel + ' — ' + db.clinica.cro))));
  cont.appendChild(el('h2', {style:'margin:0 0 2px;font-size:18px'}, 'Relatório de Odontograma'));
  cont.appendChild(el('div', {style:'font-size:12px;color:#555;margin-bottom:12px'},
    'Emitido em ' + dataBR(HOJE) + ' · Dentição ' + (modo === 'infantil' ? 'decídua (infantil)' : 'permanente (adulto)')));
  cont.appendChild(el('div', {style:'background:#f3f4f6;border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:13px' + EXATO},
    el('div', {style:'font-weight:800;font-size:15px'}, p.nome),
    el('div', {style:'color:#444'}, idade(p.nasc) + ' anos · nasc. ' + dataBR(p.nasc) +
      ' · CPF ' + (p.cpf || 'não informado') + ' · ' + (p.tel || 'sem telefone'))));
  cont.appendChild(el('div', {style:lbl}, 'Arcada superior')); cont.appendChild(arco(sup));
  cont.appendChild(el('div', {style:lbl}, 'Arcada inferior')); cont.appendChild(arco(inf));
  const leg = el('div', {style:'display:flex;flex-wrap:wrap;gap:8px 14px;margin:14px 0;font-size:11px'});
  ODT_LEGENDA.forEach(k => leg.appendChild(el('div', {style:'display:flex;align-items:center;gap:5px'},
    el('span', {style:'width:13px;height:13px;border-radius:3px;border:1.5px solid ' + ODT_STATUS[k][2] + ';background:' + ODT_STATUS[k][1] + EXATO}),
    ODT_STATUS[k][0])));
  cont.appendChild(leg);
  if (linhas.length) {
    cont.appendChild(el('h3', {style:'margin:8px 0 6px;font-size:14px'}, 'Detalhamento por dente'));
    cont.appendChild(el('table', {style:'width:100%;border-collapse:collapse;font-size:12px'},
      el('thead', {}, el('tr', {}, ['Dente','Estado','Faces','Atendimento','Observação'].map(h =>
        el('th', {style:'text-align:left;border-bottom:2px solid #1d4ed8;padding:6px 8px;background:#eef2ff' + EXATO}, h)))),
      el('tbody', {}, linhas.map(l => el('tr', {}, l.map(v =>
        el('td', {style:'padding:6px 8px;border-bottom:1px solid #e5e7eb'}, String(v))))))));
  } else {
    cont.appendChild(el('p', {style:'font-size:12px;color:#555'},
      'Nenhuma alteração registrada — todos os dentes hígidos e sem atendimento.'));
  }
  cont.appendChild(el('div', {style:'margin-top:22px;font-size:11px;color:#555;border-top:1px solid #ddd;padding-top:10px'},
    'Documento gerado pelo sistema Med Flow · ' + db.clinica.nome +
    '.  Assinatura do responsável técnico: ________________________________'));

  document.body.appendChild(cont);
  window.print();
  setTimeout(() => { const c = document.getElementById('odt-print'); if (c) c.remove(); }, 400);
}

   RELATÓRIOS — diário, semanal, anual e imposto de renda

function receitasEntre(ini, fim){
  return db.financeiro.filter(f => f.tipo === 'Receita' && f.status === 'Pago' &&
    f.data >= ini && f.data <= fim);
}
function despesasEntre(ini, fim){
  return db.financeiro.filter(f => f.tipo === 'Despesa' && f.status === 'Pago' &&
    f.data >= ini && f.data <= fim);
}
function consultasEntre(ini, fim){
  return db.agendamentos.filter(a => a.data >= ini && a.data <= fim);
}
/* ---- comissão dos dentistas (v5) ----
   Base: atendimentos CONCLUÍDOS e PAGOS no período, pelo valor do procedimento.
   Percentual: o do cadastro do colaborador (padrão db.config.comissaoDentista = 25%). */
function colabDoProf(profId){ return db.colaboradores.find(c => c.profissional_id === profId) || null; }
function pctComissao(profId){
  const c = colabDoProf(profId);
  return c && typeof c.comissao === 'number' ? c.comissao : db.config.comissaoDentista;
}
function comissoesEntre(ini, fim){
  const linhas = db.profissionais.map(p => {
    const ats = db.agendamentos.filter(a => a.profissional_id === p.id && a.status === 'Concluído' &&
      a.pago && a.data >= ini && a.data <= fim);
    const producao = ats.reduce((s, a) => s + proce(a.proc).valor, 0);
    const pct = pctComissao(p.id);
    return {prof:p, qtd:ats.length, producao:producao, pct:pct, comissao:Math.round(producao * pct) / 100};
  });
  return {linhas:linhas,
    qtd:linhas.reduce((s, l) => s + l.qtd, 0),
    producao:linhas.reduce((s, l) => s + l.producao, 0),
    comissao:linhas.reduce((s, l) => s + l.comissao, 0)};
}
/* ---- folha de pagamento: tabelas oficiais de 2026 (referência; conferir com o contador) ----
   INSS empregado (progressivo): até 1.621,00 7,5%; até 2.902,84 9%; até 4.354,27 12%; até 8.475,55 14% (teto).
   INSS contribuinte individual (autônomo) retido pela clínica: 11% até o teto.
   IRRF mensal 2026 + redutor da Lei 15.270/2025 (isenção até R$ 5.000; redução parcial até R$ 7.350). */
const INSS_FAIXAS = [[1621.00, 0.075], [2902.84, 0.09], [4354.27, 0.12], [8475.55, 0.14]];
const INSS_TETO = 8475.55;
const IRRF_FAIXAS = [[2428.80, 0, 0], [2826.65, 0.075, 182.16], [3751.05, 0.15, 394.16],
                     [4664.68, 0.225, 675.49], [Infinity, 0.275, 908.73]];
const IRRF_SIMPLIFICADO = 607.20;
const r2 = v => Math.round(v * 100) / 100;
function inssEmpregado(base){
  let total = 0, ant = 0;
  for (const [lim, aliq] of INSS_FAIXAS) {
    if (base <= ant) break;
    total += (Math.min(base, lim) - ant) * aliq; ant = lim;
  }
  return r2(total);
}
function inssAutonomo(base){ return r2(Math.min(base, INSS_TETO) * 0.11); }
function irrfMensal(rendimento, inss){
  const base = Math.max(0, Math.min(rendimento - inss, rendimento - IRRF_SIMPLIFICADO));
  const faixa = IRRF_FAIXAS.find(f => base <= f[0]);
  let imposto = Math.max(0, base * faixa[1] - faixa[2]);
  if (rendimento <= 5000) imposto = 0;
  else if (rendimento <= 7350) imposto = Math.max(0, imposto - (978.62 - 0.133145 * rendimento));
  return {base:r2(base), imposto:r2(imposto), simplificado: rendimento - IRRF_SIMPLIFICADO < rendimento - inss};
}
/* holerite de um colaborador numa competência (AAAA-MM) */
function calcularHolerite(c, refMes){
  const y = Number(refMes.slice(0, 4)), m = Number(refMes.slice(5, 7)) - 1;
  const ini = iso(new Date(y, m, 1)), fim = iso(new Date(y, m + 1, 0));
  const proventos = [], descontos = [];
  if (c.salario > 0) proventos.push(['Salário base', '30 dias', c.salario]);
  let comInfo = null;
  if (c.profissional_id) {
    const l = comissoesEntre(ini, fim).linhas.find(x => x.prof.id === c.profissional_id);
    if (l && l.comissao > 0) {
      comInfo = l;
      proventos.push(['Comissão ' + l.pct + '% sobre produção de ' + moeda(l.producao), l.qtd + ' atend.', l.comissao]);
    }
  }
  const bruto = r2(proventos.reduce((s, x) => s + x[2], 0));
  let inss = 0, ir = {base:0, imposto:0}, fgts = 0;
  if (c.vinculo === 'CLT') {
    inss = inssEmpregado(bruto);
    if (inss) descontos.push(['INSS (tabela progressiva)', '', inss]);
    fgts = r2(bruto * 0.08);
  } else if (c.vinculo === 'Autônomo (comissão)') {
    inss = inssAutonomo(bruto);
    if (inss) descontos.push(['INSS contribuinte individual', '11%', inss]);
  }
  if (c.vinculo === 'CLT' || c.vinculo === 'Autônomo (comissão)') {
    ir = irrfMensal(bruto, inss);
    if (ir.imposto) descontos.push(['IRRF', ir.simplificado ? 'desc. simplificado' : 'tabela 2026', ir.imposto]);
  }
  const totalDesc = r2(descontos.reduce((s, x) => s + x[2], 0));
  return {c:c, refMes:refMes, mesNome:MESES_LONGO[m] + '/' + y, proventos:proventos, descontos:descontos,
    bruto:bruto, totalDesc:totalDesc, liquido:r2(bruto - totalDesc), inss:inss, irBase:ir.base, ir:ir.imposto,
    fgts:fgts, comInfo:comInfo};
}

function imprimirContracheques(lista){
  if (!document.getElementById('cc-print-style')) {
    const st = document.createElement('style'); st.id = 'cc-print-style';
    st.textContent = '#cc-print{display:none}' +
      '@media print{body:has(#cc-print)>*{display:none!important}' +
      'body:has(#cc-print)>#cc-print{display:block!important}' +
      '#cc-print .cc-pagina{page-break-after:always;break-after:page}}';
    document.head.appendChild(st);
  }
  const antigo = document.getElementById('cc-print'); if (antigo) antigo.remove();
  const cont = el('div', {id:'cc-print'}, lista.map(h => el('div', {class:'cc-pagina'}, contrachequeEl(h))));
  document.body.appendChild(cont);
  window.print();
  setTimeout(() => { const x = document.getElementById('cc-print'); if (x) x.remove(); }, 400);
}

function resumoPeriodo(ini, fim){
  const rec = receitasEntre(ini, fim).reduce((s, f) => s + f.valor, 0);
  /* comissões lançadas no financeiro ficam fora das despesas para não somar duas vezes */
  const des = despesasEntre(ini, fim).filter(f => f.cat !== 'Comissões').reduce((s, f) => s + f.valor, 0);
  const com = comissoesEntre(ini, fim);
  return {rec:rec, des:des, com:com, liquido:rec - des - com.comissao};
}

    el('div', {}, el('label', {class:'label'}, 'Mês de referência'),
      el('input', {class:'input', type:'month', style:'max-width:190px', value:refMes,
        onchange: e => { const p = e.target.value.split('-');
          if (p.length === 2) { relMesRef = p[0] + '-' + p[1] + '-01'; irPara('relatorios'); } }})),
    el('button', {class:'btn btn-secondary',
      onclick: () => { relMesRef = iso(new Date(y, m - 1, 1)); irPara('relatorios'); }}, '← Mês anterior'),
    el('button', {class:'btn btn-secondary',

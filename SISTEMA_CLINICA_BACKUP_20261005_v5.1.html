/* ---------- RELATÓRIO DE ESTOQUE ---------- */
let relEstoquePeriodo = 90;
function relEstoque(box){
  const ini = maisDias(-relEstoquePeriodo);
  const movs = db.movEstoque.filter(m => m.data >= ini).sort((a,b) => b.data.localeCompare(a.data));
  const saidas = movs.filter(m => m.tipo === 'Saída');
  const entradas = movs.filter(m => m.tipo === 'Entrada');

  const valorTotal = db.estoque.reduce((s,i) => s + i.qtd * i.custo, 0);
  const abaixo = db.estoque.filter(i => i.qtd < i.min);
  const vencendo = db.estoque.filter(i => i.validade &&
    (dataDe(i.validade) - hoje) / 86400000 < 90);
  const custoCompra = abaixo.reduce((s,i) => s + (i.min * 2 - i.qtd) * i.custo, 0);

  box.appendChild(el('div', {class:'barra'},
    el('div', {}, el('label', {class:'label'}, 'Período das movimentações'),
      el('select', {class:'input', style:'max-width:200px',
        onchange: e => { relEstoquePeriodo = Number(e.target.value); irPara('relatorios'); }},
        [[30,'Últimos 30 dias'],[90,'Últimos 90 dias'],[180,'Últimos 180 dias']].map(o =>
          el('option', {value:String(o[0]),
            selected: relEstoquePeriodo === o[0] ? 'selected' : null}, o[1]))))));

  box.appendChild(el('div', {class:'card', style:'margin-bottom:18px'},
    el('h3', {style:'margin:0 0 4px;font-size:19px'}, 'Relatório de estoque'),
    el('p', {class:'muted small', style:'margin:0'},
      'Posição em ' + dataBR(HOJE) + ' · movimentações de ' + dataBR(ini) + ' a ' + dataBR(HOJE))));

  box.appendChild(blocoKpis([
    ['Itens cadastrados', String(db.estoque.length), null,
      db.estoque.reduce((s,i) => s + i.qtd, 0) + ' unidades no total'],
    ['Valor imobilizado', moeda(valorTotal), null, 'quantidade × custo unitário'],
    ['Abaixo do mínimo', String(abaixo.length), abaixo.length ? '#b91c1c' : '#0f9d58',
      abaixo.length ? 'reposição necessária' : 'nenhum item crítico'],
    ['Vencendo em 90 dias', String(vencendo.length), vencendo.length ? '#b45309' : '#0f9d58'],
    ['Compra sugerida', moeda(custoCompra), '#b45309', 'para repor ao dobro do mínimo'],
  ]));

  /* posição atual vs mínimo */
  box.appendChild(el('div', {class:'card', style:'margin-bottom:18px'},
    el('h3', {class:'secao-titulo'}, 'Posição atual — quantidade em estoque'),
    graficoBarrasH(db.estoque.slice().sort((a,b) => (a.qtd / a.min) - (b.qtd / b.min))
      .map(i => ({rotulo:i.item, valor:i.qtd,
        cor: i.qtd < i.min ? '#b91c1c' : i.qtd < i.min * 1.5 ? 'var(--serie-2)' : 'var(--serie-3)'})),
      {fmt: v => v + ' un.'}),
    el('p', {class:'muted small', style:'margin:14px 0 0'},
      'Vermelho: abaixo do mínimo · Laranja: perto do mínimo · Verde: nível adequado.')));

  /* posição detalhada */
  box.appendChild(el('h3', {class:'secao-titulo', style:'margin-top:22px'}, 'Posição detalhada'));
  box.appendChild(tabela(
    ['Item','Unidade','Qtd.','Mínimo','Custo un.','Valor em estoque','Validade','Situação'],
    db.estoque.map(i => {
      const critico = i.qtd < i.min;
      const venc = i.validade && (dataDe(i.validade) - hoje) / 86400000 < 90;
      return [i.item, i.un, String(i.qtd), String(i.min), moeda(i.custo),
        moeda(i.qtd * i.custo), i.validade ? dataBR(i.validade) : '—',
        critico ? el('span', {class:'badge danger'}, 'Repor')
        : venc ? el('span', {class:'badge warn'}, 'Vence em breve')
        : el('span', {class:'badge ok'}, 'OK')];
    }),
    ['TOTAL', '', String(db.estoque.reduce((s,i) => s + i.qtd, 0)), '', '',
      moeda(valorTotal), '', '']));

  /* sugestão de compra */
  box.appendChild(el('h3', {class:'secao-titulo', style:'margin-top:22px'}, 'Sugestão de compra'));
  if (!abaixo.length) {
    box.appendChild(el('div', {class:'card'},
      el('p', {class:'muted small', style:'margin:0'},
        'Nenhum item abaixo do mínimo. Nada a comprar no momento.')));
  } else {
    box.appendChild(tabela(['Item','Em estoque','Mínimo','Comprar','Custo estimado'],
      abaixo.map(i => {
        const comprar = i.min * 2 - i.qtd;
        return [i.item, i.qtd + ' ' + i.un, String(i.min),
          el('strong', {}, comprar + ' ' + i.un), moeda(comprar * i.custo)];
      }),
      ['TOTAL', '', '', '', moeda(custoCompra)]));
  }

  /* consumo por item no período */
  const consumo = db.estoque.map(i => ({rotulo:i.item,
    valor: saidas.filter(m => m.item_id === i.id).reduce((s,m) => s + m.qtd, 0)}))
    .filter(x => x.valor > 0).sort((a,b) => b.valor - a.valor);
  box.appendChild(el('div', {class:'card', style:'margin-top:22px'},
    el('h3', {class:'secao-titulo'},
      'Itens mais consumidos nos últimos ' + relEstoquePeriodo + ' dias'),
    consumo.length ? graficoBarrasH(consumo, {fmt: v => v + ' un.'})
      : el('p', {class:'muted small', style:'margin:0'}, 'Nenhuma saída registrada no período.')));

  /* consumo mês a mês */
  const mesesMov = [];
  for (let k = 5; k >= 0; k--) {
    const d = new Date(hoje.getFullYear(), hoje.getMonth() - k, 1);
    const a = iso(d), b = iso(new Date(d.getFullYear(), d.getMonth() + 1, 0));
    mesesMov.push({rotulo: MESES[d.getMonth()],
      valores:[
        db.movEstoque.filter(m => m.tipo === 'Saída' && m.data >= a && m.data <= b)
          .reduce((s,m) => s + m.valor, 0),
        db.movEstoque.filter(m => m.tipo === 'Entrada' && m.data >= a && m.data <= b)
          .reduce((s,m) => s + m.valor, 0)]});
  }
  box.appendChild(el('div', {class:'card', style:'margin-top:18px'},
    el('h3', {class:'secao-titulo'}, 'Consumo e reposição por mês (em valor)'),
    graficoColunas(mesesMov, {series:[{nome:'Consumo (saídas)', cor:'var(--serie-2)'},
      {nome:'Compras (entradas)', cor:'var(--serie-1)'}], fmt:moeda})));

  /* últimas movimentações */
  box.appendChild(el('h3', {class:'secao-titulo', style:'margin-top:22px'},
    'Últimas movimentações (' + movs.length + ' no período)'));
  if (!movs.length) {
    box.appendChild(el('div', {class:'card'},
      el('p', {class:'muted small', style:'margin:0'}, 'Nenhuma movimentação no período.')));
  } else {
    box.appendChild(tabela(['Data','Item','Tipo','Quantidade','Motivo','Valor'],
      movs.slice(0, 40).map(m => [dataBR(m.data), m.item,
        el('span', {class:'badge ' + (m.tipo === 'Entrada' ? 'ok' : 'warn')}, m.tipo),
        String(m.qtd), m.motivo, moeda(m.valor)]),
      ['', '', 'Entradas: ' + entradas.length, 'Saídas: ' + saidas.length, '',
        moeda(entradas.reduce((s,m) => s + m.valor, 0) -
              saidas.reduce((s,m) => s + m.valor, 0))]));
  }
}

/* ---------- RELATÓRIO DIÁRIO ---------- */
function relDiario(box){
  box.appendChild(el('div', {class:'barra'},
    el('div', {}, el('label', {class:'label'}, 'Dia do relatório'),
      el('input', {class:'input', type:'date', value:relData,
        onchange: e => { relData = e.target.value; irPara('relatorios'); }})),
    el('button', {class:'btn btn-secondary',
      onclick: () => { relData = HOJE; irPara('relatorios'); }}, 'Hoje'),
    el('button', {class:'btn btn-secondary',
      onclick: () => { relData = somaDias(relData, -1); irPara('relatorios'); }}, '← Dia anterior')));

  const d = relData;
  const cons = consultasEntre(d, d);
  const rec = receitasEntre(d, d), des = despesasEntre(d, d);
  const totalRec = rec.reduce((s,f) => s + f.valor, 0);
  const totalDes = des.reduce((s,f) => s + f.valor, 0);
  const concl = cons.filter(a => a.status === 'Concluído').length;
  const faltas = cons.filter(a => a.status === 'Faltou').length;
  const efetivas = cons.filter(a => a.status !== 'Cancelado').length;

  box.appendChild(el('div', {class:'card', style:'margin-bottom:18px'},
    el('h3', {style:'margin:0 0 4px;font-size:19px'},
      'Relatório diário — ' + dataBR(d)),
    el('p', {class:'muted small', style:'margin:0'},
      DIAS[dataDe(d).getDay()] + ' · ' + db.clinica.nome)));

  box.appendChild(blocoKpis([
    ['Consultas do dia', String(efetivas), null, concl + ' concluídas · ' + faltas + ' faltas'],
    ['Recebido no dia', moeda(totalRec), '#0f9d58', rec.length + ' recebimentos'],
    ['Despesas do dia', moeda(totalDes), '#b91c1c', des.length + ' lançamentos'],
    ['Resultado líquido do dia', moeda(resumoPeriodo(d, d).liquido),
      resumoPeriodo(d, d).liquido >= 0 ? '#0f9d58' : '#b91c1c', 'após comissões dos dentistas'],
    ['Taxa de comparecimento', efetivas ? Math.round(concl / efetivas * 100) + '%' : '—',
      null, 'concluídas ÷ agendadas'],
  ]));

  box.appendChild(blocoTotais(d, d, 'do dia'));

  /* recebimentos por forma de pagamento */
  const porForma = FORMAS.map(f => ({rotulo:f, cor:CORES_FORMA[f],
    valor: rec.filter(x => x.forma === f).reduce((s,x) => s + x.valor, 0)}));
  box.appendChild(el('div', {class:'card', style:'margin-bottom:18px'},
    el('h3', {class:'secao-titulo'}, 'Recebimentos por forma de pagamento'),
    totalRec ? graficoBarrasH(porForma, {fmt:moeda, total:true, rotuloTotal:'Total recebido'})

/* ---------- RELATÓRIO DE IMPOSTO DE RENDA ---------- */
function calcularIR(ano, automatico){
  const ini = ano + '-01-01', fim = ano + '-12-31';
  const rec = receitasEntre(ini, fim), des = despesasEntre(ini, fim);
  const receitaBruta = rec.reduce((s,f) => s + f.valor, 0);
  const despesaTotal = des.reduce((s,f) => s + f.valor, 0);

  /* por paciente — base da DMED (serviços de saúde) */
  const mapa = {};
  rec.forEach(f => {
    if (!f.paciente_id) return;
    if (!mapa[f.paciente_id]) mapa[f.paciente_id] = {total:0, qtd:0};
    mapa[f.paciente_id].total += f.valor;
    mapa[f.paciente_id].qtd++;
  });
  const porPaciente = Object.keys(mapa).map(id => {
    const p = pac(Number(id));
    /* Menor de idade: o pagamento é declarado no CPF do responsável (titular),
       com o dependente identificado — é assim que a declaração de serviços
       de saúde espera receber a informação. */
    const r = p.resp ? pac(p.resp) : null;
    return {paciente_id:Number(id), nome:p.nome,
      cpf: r ? r.cpf : p.cpf,
      titular: r ? r.nome : p.nome,
      dependente: !!r,
      total:mapa[id].total, qtd:mapa[id].qtd};
  }).sort((a,b) => b.total - a.total);

  const porCategoria = {};
  des.forEach(f => porCategoria[f.cat] = (porCategoria[f.cat] || 0) + f.valor);

  const porForma = {};
  FORMAS.forEach(f => porForma[f] = rec.filter(x => x.forma === f).reduce((s,x) => s + x.valor, 0));

  return {ano:ano, automatico:!!automatico,
    geradoEm: new Date().toLocaleString('pt-BR'),
    receitaBruta:receitaBruta, despesaTotal:despesaTotal,
    resultado:receitaBruta - despesaTotal,
    porPaciente:porPaciente, porCategoria:porCategoria, porForma:porForma,
    semCpf: porPaciente.filter(p => !p.cpf).length};
}

function gerarIR(ano, automatico){
  const r = calcularIR(ano, automatico);
  const i = db.relatoriosIR.findIndex(x => x.ano === ano);
  if (i >= 0) db.relatoriosIR[i] = r; else db.relatoriosIR.push(r);
  return r;
}

/* Geração automática em 31/12 às 23:59 */
function verificarFechamentoAnual(){
  const agora = new Date();
  const ehFechamento = agora.getMonth() === 11 && agora.getDate() === 31 &&
    (agora.getHours() > 23 || (agora.getHours() === 23 && agora.getMinutes() >= 59));
  if (!ehFechamento) return;
  const ano = agora.getFullYear();
  if (db.relatoriosIR.some(x => x.ano === ano && x.automatico)) return;
  gerarIR(ano, true);
  toast('Fechamento automático de 31/12 23:59 — relatório de IR ' + ano + ' gerado.', 'ok');
  if (sessao && sessao.tipo === 'admin' && atual === 'relatorios') irPara('relatorios');
}
setInterval(verificarFechamentoAnual, 20000);

function proximoFechamento(){
  const agora = new Date();
  let alvo = new Date(agora.getFullYear(), 11, 31, 23, 59, 0);
  if (agora > alvo) alvo = new Date(agora.getFullYear() + 1, 11, 31, 23, 59, 0);
  const dias = Math.ceil((alvo - agora) / 86400000);
  return {alvo:alvo, dias:dias};
}

function senhaAleatoria(){
  const letras = 'ABCDEFGHJKLMNPQRSTUVWXYZ', nums = '23456789';
  let s = '';
  const r = crypto.getRandomValues(new Uint32Array(8));
  for (let i = 0; i < 4; i++) s += letras[r[i] % letras.length];
  for (let i = 4; i < 8; i++) s += nums[r[i] % nums.length];
  return s;
}
function gerarProvisoria(u){
  const nova = senhaAleatoria();
  u.senha = nova; u.temporaria = true; u.ativo = true;
  abrirAviso('Senha provisória gerada',
    'Passe esta senha para ' + pac(u.paciente_id).nome + '. No primeiro acesso o sistema pede a troca.',
    nova);
}
function modalTrocarSenha(u){
  abrirModal('Definir senha de ' + pac(u.paciente_id).nome,
    'Login pelo CPF ' + (u.cpf || '—') + '. A nova senha passa a valer imediatamente.', [
    ['senha','Nova senha * (mínimo 6 caracteres)','text',true,'col-full'],
    ['temp','Exigir troca no próximo acesso *','select',true,'col-full',
      [['sim','Sim — marcar como provisória'],['nao','Não — senha definitiva']]],
  ], v => {
    if (v.senha.length < 6) { toast('A senha precisa ter pelo menos 6 caracteres.', 'warn'); return false; }
    u.senha = v.senha; u.padrao = false; u.temporaria = (v.temp === 'sim'); u.ativo = true;
    toast('Senha de ' + pac(u.paciente_id).nome + ' atualizada.');
    irPara('usuarios');
  });
}
function modalNovaConta(){
  const semConta = db.pacientes.filter(p =>

/* horários livres de um dia para um profissional */
function horariosLivres(data, profId){
  const procId = novoAg && novoAg.proc ? novoAg.proc : 1;
  return HORARIOS.map(h => ({hora:h, livre:
    !db.agendamentos.some(a => a.data === data && a.profissional_id === profId && a.status !== 'Cancelado' &&
      minutosDe(h) < minutosDe(a.hora) + duracaoProc(a.proc) && minutosDe(a.hora) < minutosDe(h) + duracaoProc(procId)) &&
    db.cadeiras.some(cd => !choqueAgenda(data, h, procId, cd.id, profId))}));
}

    bloco4.appendChild(el('p', {class:'muted small', style:'margin:14px 0 0'},
      'O cartão é passado na maquininha da recepção no dia da consulta — ' +
      'nenhum dado do cartão é digitado aqui.'));
  }
  c.appendChild(bloco4);
  if (passo === 4) return;

  /* --- passo 5: confirmação --- */
  const conflito = db.agendamentos.some(a => a.data === novoAg.data && a.hora === novoAg.hora &&
    a.profissional_id === novoAg.prof && a.status !== 'Cancelado');

  c.appendChild(el('div', {class:'card'},
    el('h3', {class:'secao-titulo'}, '5. Confira e confirme'),
    el('div', {class:'resumo', style:'margin-bottom:18px'},
      el('dl', {},
        el('dt', {}, 'Paciente'),   el('dd', {}, p.nome),
        el('dt', {}, 'Serviço'),    el('dd', {}, pr.nome),
        el('dt', {}, 'Profissional'), el('dd', {}, prof(novoAg.prof).nome),
        el('dt', {}, 'Data'),       el('dd', {}, DIAS[dataDe(novoAg.data).getDay()] + ', ' +
                                                  dataBR(novoAg.data)),
        el('dt', {}, 'Horário'),    el('dd', {}, novoAg.hora),
        el('dt', {}, 'Pagamento'),  el('dd', {}, novoAg.forma +
          (novoAg.cartao === 'credito' && novoAg.parcelas > 1 ? ' em ' + novoAg.parcelas + 'x' : '')),
        el('dt', {}, 'Valor'),      el('dd', {style:'font-size:17px;color:var(--brand-700)'},
                                       moeda(pr.valor)))),
    conflito ? el('div', {class:'aviso', style:'margin-bottom:16px'},
      'Esse horário acabou de ser ocupado. Escolha outro horário.') : null,
    el('div', {style:'display:flex;gap:10px;flex-wrap:wrap'},
      el('button', {class:'btn btn-primary', disabled: conflito ? 'disabled' : null,
        onclick: confirmarAgendamento}, 'Confirmar agendamento'),
      el('button', {class:'btn btn-secondary', onclick: () => {
        novoAg = {proc:null, prof:null, data:null, hora:null, forma:null, cartao:null, parcelas:1};
        irPortal('novo');
      }}, 'Recomeçar'))));
}

function confirmarAgendamento(){
  const p = pacienteLogado(), pr = proce(novoAg.proc);
  const cadeiraLivre = db.cadeiras.find(cd => !choqueAgenda(novoAg.data, novoAg.hora, novoAg.proc, cd.id, novoAg.prof));
  if (!cadeiraLivre) { toast('Esse horário não está mais disponível. Escolha outro.', 'warn'); return; }

  const ag = {id:proxId(db.agendamentos), paciente_id:p.id, profissional_id:novoAg.prof,
    cadeira_id:cadeiraLivre.id, data:novoAg.data, hora:novoAg.hora, proc:novoAg.proc,
    status:'Confirmado', forma:novoAg.forma, pago:false, origem:'Portal do paciente',
    parcelas: novoAg.cartao === 'credito' ? novoAg.parcelas : 1};
  db.agendamentos.push(ag);

  db.financeiro.push({id:proxId(db.financeiro), tipo:'Receita',
    desc:pr.nome + ' — ' + p.nome + ' (portal)', cat:'Procedimentos', valor:pr.valor,
    data:novoAg.data, status:'Pendente', forma:novoAg.forma, paciente_id:p.id,
    agendamento_id:ag.id});

  const detalhe = novoAg.forma === 'Pix'
    ? 'Chave Pix: ' + db.clinica.cnpj + ' — ' + moeda(pr.valor)
    : novoAg.forma === 'Dinheiro'
      ? 'Leve ' + moeda(pr.valor) + ' no dia da consulta.'
      : novoAg.forma + (novoAg.parcelas > 1 ? ' em ' + novoAg.parcelas + 'x de ' +
          moeda(pr.valor / novoAg.parcelas) : '') + ' — na maquininha da recepção.';

  abrirAviso('Consulta confirmada!',
    pr.nome + ' com ' + prof(novoAg.prof).nome + ' em ' + dataBR(novoAg.data) +
    ' às ' + novoAg.hora + '.\n\n' + detalhe, null, () => {
      novoAg = {proc:null, prof:null, data:null, hora:null, forma:null, cartao:null, parcelas:1};
      irPortal('meus');
    });
  toast('Agendamento confirmado!');
}

function abrirModal(titulo, sub, campos, onSalvar, iniciais){
  iniciais = iniciais || {};
  const inputs = {};
  const grid = el('div', {class:'form-grid'});
  campos.forEach(cfg => {
    const nome = cfg[0], rotulo = cfg[1], tipo = cfg[2], cls = cfg[4], opcoes = cfg[5];
    let inp;
    if (tipo === 'select') {
      inp = el('select', {class:'input'}, opcoes.map(o =>
        el('option', {value:String(o[0])}, o[1])));
    } else {
      inp = el('input', {class:'input', type:tipo, step: tipo === 'number' ? '0.01' : null});
      if (tipo === 'date' && nome !== 'nasc') inp.value = HOJE;
      if (tipo === 'date' && nome === 'nasc') inp.max = HOJE;
      if (tipo === 'number' && nome === 'valor') inp.min = '0.01';
    }
    if (iniciais[nome] != null) inp.value = String(iniciais[nome]);
    inputs[nome] = inp;
    grid.appendChild(el('div', {class: cls || ''}, el('label', {class:'label'}, rotulo), inp));
  });

  const erro = el('div', {class:'msg-erro hidden'});
  const bg = el('div', {class:'modal-bg', onclick: e => { if (e.target === bg) fechar(); }});
  bg.appendChild(el('div', {class:'modal'},
    el('h3', {}, titulo), el('p', {class:'sub'}, sub), erro, grid,
    el('div', {class:'modal-acoes'},
      el('button', {class:'btn btn-secondary', onclick:fechar}, 'Cancelar'),
      el('button', {class:'btn btn-primary', onclick:salvar}, 'Salvar'))));
  $('#modais').appendChild(bg);
  const primeiro = inputs[campos[0][0]];
  setTimeout(() => primeiro.focus(), 50);

  function fechar(){ bg.remove(); }
  function salvar(){
    const vals = {}; let falta = null;
    campos.forEach(cfg => {
      const v = inputs[cfg[0]].value;
      vals[cfg[0]] = typeof v === 'string' ? v.trim() : v;
      if (cfg[3] && !vals[cfg[0]] && !falta) falta = cfg[1].replace(' *','');
    });
    if (falta) { mostrar(erro, 'Preencha o campo obrigatório: ' + falta); return; }
    if (onSalvar(vals) === false) return;
    fechar();
  }
}

/* acessibilidade dos modais: Esc fecha o modal de cima; o foco entra no modal ao abrir */
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  const abertos = document.querySelectorAll('.modal-bg');
  if (abertos.length) {
    const topo = abertos[abertos.length - 1];
    if (typeof topo._fechar === 'function') topo._fechar(); else topo.remove();
    e.preventDefault();
  }
});
new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(n => {
  if (n.nodeType === 1 && n.classList.contains('modal-bg')) setTimeout(() => {
    if (n.contains(document.activeElement)) return;
    const alvo = n.querySelector('input, select, textarea, button');
    if (alvo) alvo.focus();
  }, 60);
}))).observe(document.body, {childList:true, subtree:true});

function abrirAviso(titulo, texto, destaque, aoFechar){
  const bg = el('div', {class:'modal-bg'});
  bg.appendChild(el('div', {class:'modal', style:'max-width:460px'},

      'display:grid;place-items:center;margin-bottom:16px', html: svg(ico.check)}),
    el('h3', {}, titulo),
    el('p', {class:'sub', style:'white-space:pre-line'}, texto),
    destaque ? el('div', {class:'pix-box', style:'text-align:center;font-size:22px;letter-spacing:3px'},
      destaque) : null,
    el('div', {class:'modal-acoes'},
      el('button', {class:'btn btn-primary', onclick: () => bg._fechar()}, 'Entendi'))));
  bg._fechar = () => { bg.remove(); if (aoFechar) aoFechar(); };
  $('#modais').appendChild(bg);
}

/* ---------------- controle de acesso: senha do administrador ----------------
   Observação: por ser um arquivo que roda no navegador, esta senha evita
   acesso casual, mas não substitui a autenticação do servidor (backend). */
/* PBKDF2-SHA-256 (150 mil iterações) via Web Crypto: evita colisões e torna lenta a força bruta */
const ADMIN_SALT = 'medflow-4.0-acesso', ADMIN_ITER = 150000;
async function hashSenha(s){
  const enc = new TextEncoder();
  const chave = await crypto.subtle.importKey('raw', enc.encode(String(s)), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name:'PBKDF2', salt:enc.encode(ADMIN_SALT), iterations:ADMIN_ITER, hash:'SHA-256'}, chave, 256);
  return Array.from(new Uint8Array(bits)).map(b => b.toString(16).padStart(2, '0')).join('');
}
let tentativasAcesso = 0, bloqueioAte = 0;
const ADMIN_LOGIN = 'adminds';
let ADMIN_HASH = '6fd143c61aff022a92bccae3856a557e04aa2548f3a02cd6a25d4bf3dbbddc54';
async function verificarSenha(){
  const inp = $('#senha-input'), err = $('#senha-erro'), lg = $('#login-input');
  if (Date.now() < bloqueioAte) {
    err.textContent = 'Muitas tentativas. Aguarde ' + Math.ceil((bloqueioAte - Date.now()) / 1000) + ' s.'; return; }
  if (!window.crypto || !crypto.subtle) {
    err.textContent = 'Este navegador não oferece a criptografia necessária. Use Chrome, Edge ou Firefox atualizados.'; return; }
  const ok = lg.value.trim().toLowerCase() === ADMIN_LOGIN && (await hashSenha(inp.value)) === ADMIN_HASH;
  if (ok) { tentativasAcesso = 0; err.textContent = ''; inp.value = ''; $('#tela-senha').style.display = 'none'; abrirSistema(); }
  else {
    tentativasAcesso++;
    if (tentativasAcesso >= 5) { bloqueioAte = Date.now() + 30000; tentativasAcesso = 0; }
    err.textContent = 'Login ou senha incorretos. Tente novamente.'; inp.value = ''; inp.focus();
  }
}

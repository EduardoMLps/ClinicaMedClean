# Med Flow - nginx do frontend (HTTP).
# Para HTTPS em producao, use nginx-https.conf.exemplo (correcao B7).

server_tokens off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Limite de upload alinhado com MAX_CONTENT_LENGTH do backend (B10).
    client_max_body_size 10m;

    include /etc/nginx/conf.d/seguranca-headers.inc;

    # Proxy da API para o servico backend (rede interna do Docker).
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Sobrescreve (nao concatena) para que o cliente nao consiga
        # forjar o IP usado no limite de tentativas de login (B6).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Respostas da API trazem dados de pacientes: nao guardar em cache.
        add_header Cache-Control "no-store" always;
        include /etc/nginx/conf.d/seguranca-headers.inc;
    }

    # SPA: qualquer rota desconhecida cai no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets com hash no nome podem ser cacheados de forma agressiva.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/conf.d/seguranca-headers.inc;
    }
}
